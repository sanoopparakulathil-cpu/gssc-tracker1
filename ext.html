<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GSSC Fire Extinguisher Register</title>
<style>
:root{--bg:#0b0b0b;--fg:#f2f2f2;--mut:#a8a8a8;--card:rgba(30,30,30,.92);--line:#333;--red:#c00000}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px}
header{background:var(--red);color:#fff;padding:14px 16px;font-weight:700}header small{display:block;font-weight:400;opacity:.9}
main{padding:14px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.big{font-size:24px;font-weight:700}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.row span:first-child{color:var(--mut)}.row span:last-child{font-weight:600;text-align:right}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700;color:#fff}
.ok{background:#1a7f37}.warn{background:#b26a00}.bad{background:#c00000}.na{background:#777}
input,button{font:inherit;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);margin:4px 0 10px}
button{background:var(--red);color:#fff;border:0;font-weight:700}
.item{padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}.item b{display:block}.item small{color:var(--mut)}
#sp{position:fixed;inset:0;background:#000;z-index:99;display:flex;align-items:center;justify-content:center;transition:opacity .6s}
#sp img{width:100%;max-width:720px;height:auto}#sp.h{opacity:0;pointer-events:none}
.ban{background:#000;text-align:center}.ban img{width:100%;max-width:720px;height:170px;object-fit:cover;object-position:center 52%;display:block;margin:0 auto}
.sub{background:#c00000;color:#fff;text-align:center;font-weight:700;font-size:13px;padding:8px}
body{background:radial-gradient(ellipse at 50% 0,#1c1c1c 0,#0b0b0b 70%) fixed}
</style></head><body>

<script>
var app=document.getElementById('app'),DATA={},T0=Date.now(),sp=document.getElementById('sp');
function hideSp(){sp.className='h'}
sp.onclick=hideSp;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(v){if(!v)return '—';if(/^\d{4}-\d{2}-\d{2}$/.test(v)){var d=new Date(v+'T00:00:00');return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}return esc(v)}
function status(d){if(!d.next)return['na','No due date'];var n=new Date(d.next+'T00:00:00'),t=new Date();t.setHours(0,0,0,0);var diff=Math.round((n-t)/864e5);if(diff<0)return['bad','OVERDUE '+(-diff)+' days'];if(diff<=30)return['warn','Due in '+diff+' days'];return['ok','OK · due in '+diff+' days']}
var HY={'ABC-DCP':12,'CO2':5,'WCP':5};
function hydro(d){var iv=HY[d.type];if(!iv)return{iv:null,txt:'Per cylinder standard',cls:'na',lab:'Check manually'};
 var cy=new Date().getFullYear(),y=null,due=null;
 if(d.hydro&&/^\d{4}-\d{2}-\d{2}$/.test(d.hydro)){var h=new Date(d.hydro+'T00:00:00');due=new Date(h.getFullYear()+iv,h.getMonth(),h.getDate());y=due.getFullYear();
  var t=new Date();t.setHours(0,0,0,0);var df=Math.round((due-t)/864e5);
  return{iv:iv,txt:fmt(due.getFullYear()+'-'+String(due.getMonth()+1).padStart(2,'0')+'-'+String(due.getDate()).padStart(2,'0')),cls:df<0?'bad':df<=365?'warn':'ok',lab:df<0?'HYDRO OVERDUE':df<=365?'Hydro due in '+df+' days':'Hydro OK'}}
 var m=parseInt(d.mfg,10);if(!m)return{iv:iv,txt:'Enter MFG year',cls:'na',lab:'MFG year missing'};
 y=m+iv;return{iv:iv,txt:String(y),cls:cy>y?'bad':cy===y?'warn':cy===y-1?'warn':'ok',lab:cy>y?'HYDRO OVERDUE':cy===y?'Hydro due this year':cy===y-1?'Hydro due next year':'Hydro OK'}}
function svc(d){if(!d.service||!/^\d{4}-\d{2}-\d{2}$/.test(d.service))return{txt:'Enter service date',cls:'na',lab:'Service date missing'};
 var a=new Date(d.service+'T00:00:00'),n=new Date(a.getFullYear(),a.getMonth()+6,a.getDate());var t=new Date();t.setHours(0,0,0,0);var df=Math.round((n-t)/864e5);
 var iso=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
 return{txt:fmt(iso),cls:df<0?'bad':df<=30?'warn':'ok',lab:df<0?'SERVICE OVERDUE':df<=30?'Service due in '+df+' days':'Service OK'}}
function maint6(d){var m=parseInt(d.mfg,10);if(d.type!=='ABC-DCP'||!m)return null;return m+6}
function getId(){return decodeURIComponent((location.hash||'').replace(/^#\/?/,'')).trim()}
function route(){var id=getId().toUpperCase();if(id&&DATA[id])show(id);else list(id)}
function show(id){var d=DATA[id],s=status(d),hy=hydro(d),m6=maint6(d),sv=svc(d);
 app.innerHTML='<div class="card"><div class="big">'+esc(id)+'</div><div>'+esc(d.loc)+' · '+esc(d.site)+'</div><p><span class="badge '+s[0]+'">Inspection: '+esc(s[1])+'</span> <span class="badge '+hy.cls+'">'+esc(hy.lab)+'</span> <span class="badge '+sv.cls+'">'+esc(sv.lab)+'</span></p></div>'+
 '<div class="card"><div class="row"><span>Type</span><span>'+esc(d.type)+'</span></div>'+
 '<div class="row"><span>Model</span><span>'+esc(d.model)+'</span></div>'+
 '<div class="row"><span>Last service / inspection</span><span>'+fmt(d.last)+'</span></div>'+
 '<div class="row"><span>Next inspection due</span><span>'+fmt(d.next)+'</span></div>'+
 '<div class="row"><span>Manufacture year</span><span>'+fmt(d.mfg)+'</span></div>'+
 '<div class="row"><span>Last service date</span><span>'+fmt(d.service)+'</span></div>'+
 '<div class="row"><span>Next service due (every 6 months)</span><span>'+sv.txt+'</span></div>'+
 '<div class="row"><span>Last hydro test date</span><span>'+fmt(d.hydro)+'</span></div>'+
 '<div class="row"><span>Hydro test interval (NFPA 10)</span><span>'+(hy.iv?hy.iv+' years':'—')+'</span></div>'+
 '<div class="row"><span>Next hydro test due</span><span>'+hy.txt+'</span></div>'+
 (m6?'<div class="row"><span>6-year maintenance due</span><span>'+m6+'</span></div>':'')+'</div>'+
 '<button onclick="location.hash=\'\'">All extinguishers</button>'}
function list(q){
 app.innerHTML='<input id="q" placeholder="Search ID / location / site" value="'+esc(q)+'"><div id="l" class="card"></div>';
 var inp=document.getElementById('q'),box=document.getElementById('l');
 function draw(){var s=inp.value.toLowerCase(),out=[];
  Object.keys(DATA).sort().forEach(function(id){var d=DATA[id];if((id+' '+d.loc+' '+d.site+' '+d.model).toLowerCase().indexOf(s)>-1&&out.length<80){var c=status(d),hh=hydro(d),ss=svc(d);out.push('<div class="item" data-id="'+esc(id)+'"><b>'+esc(id)+' · '+esc(d.loc)+'</b><small>'+esc(d.site)+' · '+esc(d.type)+' · <span class="badge '+c[0]+'">'+esc(c[1])+'</span></small></div>')}});
  box.innerHTML=out.length?out.join(''):'No match';
  Array.prototype.forEach.call(box.querySelectorAll('.item'),function(e){e.onclick=function(){location.hash=e.getAttribute('data-id')}})}
 inp.oninput=draw;draw()}
fetch('ext-data.json?'+Date.now()).then(function(r){return r.json()}).then(function(j){DATA=j;route();window.addEventListener('hashchange',route);setTimeout(hideSp,Math.max(0,2500-(Date.now()-T0)))}).catch(function(){app.innerHTML='<div class="card">Cannot load data. Check internet.</div>';hideSp()});
</script></body></html>
