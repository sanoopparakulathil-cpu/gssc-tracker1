<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<link rel="manifest" href="tech.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>GSSC Technician</title>
<style>
:root{--navy:#1F3864;--bg:#F4F6FA;--card:#fff;--line:#D9DFEA;--ink:#17202E;--mute:#5B6678;
  --ok:#1E8E3E;--okbg:#E6F4EA;--warn:#B26A00;--warnbg:#FFF4E0;--bad:#C5221F;--badbg:#FCE8E6;--blue:#1A56DB;--bluebg:#E8F0FE}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1}
header small{display:block;font-weight:400;opacity:.8;font-size:12px}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:14px}
nav{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;overflow-x:auto}
nav button{flex:1 0 auto;padding:14px 12px;border:0;background:none;font-size:14px;color:var(--mute);border-bottom:3px solid transparent}
nav button[aria-selected=true]{color:var(--navy);border-bottom-color:var(--navy);font-weight:600}
main{padding:14px 16px 90px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:16px}
.sub{color:var(--mute);font-size:14px}
.pill{display:inline-block;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:600}
.p-Pending{background:#EEF1F6;color:var(--mute)}
.p-In{background:var(--bluebg);color:var(--blue)}
.p-Completed,.p-ok{background:var(--okbg);color:var(--ok)}
.p-out{background:var(--warnbg);color:var(--warn)}
.p-bad{background:var(--badbg);color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.btn{border:0;border-radius:10px;padding:14px 18px;font-size:16px;font-weight:600;background:var(--navy);color:#fff;min-height:48px}
.btn.sec{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.go{background:var(--ok)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
input,select,textarea{width:100%;font-size:17px;padding:13px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:80px;font-family:inherit}
.banner{border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:15px}
.b-warn{background:var(--warnbg);color:var(--warn);border:1px solid #F0D49A}
.b-bad{background:var(--badbg);color:var(--bad);border:1px solid #F3B9B5}
.b-info{background:var(--bluebg);color:var(--blue);border:1px solid #BBD0F8}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal{background:#fff;width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:18px 16px;padding-bottom:max(18px,env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.modal h2{margin:0 0 4px;font-size:18px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.chk input{width:24px;height:24px;margin:0;flex:none}
.hist{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.hist:last-child{border:0}
.pend{font-size:12px;color:var(--warn);font-weight:600}
.center{max-width:420px;margin:40px auto}
.mh{font-weight:700;color:var(--navy);margin:16px 2px 8px;font-size:15px;border-bottom:2px solid var(--navy);padding-bottom:4px}
.cf h4{margin:18px 0 6px;font-size:14px;color:var(--navy);background:#E9EEF7;padding:8px 10px;border-radius:8px}
.cf .it{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.cf .it .n{font-weight:700;color:var(--navy)}
.cf .it .ref{font-size:12px;color:var(--mute)}
.cf .yn{display:flex;gap:8px;margin:10px 0 8px}
.cf .yn button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:12px 0;font-size:16px;font-weight:600;color:var(--mute)}
.cf .yn button.on-y{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.cf .yn button.on-n{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.cf .yn button.on-na{background:#EEF1F6;border-color:var(--mute);color:var(--ink)}
.cf textarea{min-height:64px;font-size:16px}
.cf .bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 0;margin-top:14px;display:flex;gap:8px;align-items:center}
.cf .g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.cf .fr{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:10px;background:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#202124;color:#fff;padding:12px 18px;border-radius:10px;font-size:15px;z-index:30;max-width:90%}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";
var CFG_KEY="gssc-tech-cfg", Q_KEY="gssc-tech-q", S_KEY="gssc-tech-s";
var cfg={url:"",name:"",pin:"",stay:true};
var S=null;            // last state from server
var LQ={amc:"",gmc:""}, LF={amc:"open",gmc:"open"};
var CF=null, CFRO=false, CFK="gssc-tech-cf";
var SD=null, SDK="gssc-tech-sd", MR=null, MRRO=false, MRK="gssc-tech-mr", SCH=null, SCHK="gssc-tech-sch";
var tab="jobs", busy=false, loginErr="", names=null, online=true, lastSync=0, flushing=false;
var el=function(id){return document.getElementById(id);};
var app=el("app");

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,9);}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function queue(){return lsGet(Q_KEY,[]);}
function setQueue(q){lsSet(Q_KEY,q);}
function tm(ts){return ts?new Date(ts).toLocaleString("en-GB",{timeZone:"Asia/Riyadh",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit",hour12:false}):"";}
function dshort(d){if(!d)return "";var p=d.split("-");var m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return p[2]+" "+m[+p[1]-1];}
function toast(m){var o=document.querySelector(".toast");if(o)o.remove();var t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove();},3500);}

/* ---------- config: address comes from the link (?u=...) once, then is remembered ---------- */
(function init(){
  var c=lsGet(CFG_KEY,{});
  cfg.url=c.url||"";cfg.name=c.name||"";cfg.pin=c.pin||"";cfg.stay=c.stay!==false;
  try{var u=new URLSearchParams(location.search).get("u");
    if(u&&/^https:\/\/script\.google\.com\//.test(u)){cfg.url=u;saveCfg();}}catch(e){}
})();
function saveCfg(){lsSet(CFG_KEY,{url:cfg.url,name:cfg.name,pin:cfg.stay?cfg.pin:"",stay:cfg.stay});}

/* ---------- talking to the script ---------- */
function post(body){
  return fetch(cfg.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)})
    .then(function(r){return r.json();});
}
function auth(extra){var o={tech:cfg.name,pin:cfg.pin};for(var k in extra)o[k]=extra[k];return o;}

function loadNames(){
  return post({action:"t_names"}).then(function(r){names=r&&r.ok?r.names:[];draw();})
    .catch(function(){names=[];loginErr="No connection. Check your signal.";draw();});
}

function refresh(){
  if(!cfg.name||!cfg.pin)return Promise.resolve();
  return post(auth({action:"t_state"})).then(function(r){
    online=true;
    if(!r||!r.ok){
      if(r&&/PIN|Name not found|Too many/.test(r.error||"")){cfg.pin="";saveCfg();S=null;loginErr=r.error;draw();return;}
      throw new Error(r&&r.error||"failed");}
    S=r;lastSync=Date.now();lsSet(S_KEY,S);draw();
  }).catch(function(){online=false;draw();});
}

/* every update waits in a queue on the phone until the server confirms it, so weak signal never loses work */
function send(action,ev){
  ev.id=uid();ev.clientTs=Date.now();
  var q=queue();q.push({action:action,ev:ev});setQueue(q);
  draw();flush();
}
function flush(){
  if(flushing)return Promise.resolve();
  var q=queue();if(!q.length)return Promise.resolve();
  flushing=true;
  function next(){
    q=queue();
    if(!q.length){flushing=false;draw();return refresh();}
    var it=q[0];
    return post(auth({action:it.action,ev:it.ev})).then(function(r){
      online=true;
      if(r&&r.ok){q=queue();q.shift();setQueue(q);S=r;lastSync=Date.now();lsSet(S_KEY,S);draw();return next();}
      // server refused this update (for example tool already taken): drop it and tell the technician
      q=queue();q.shift();setQueue(q);toast(r&&r.error?r.error:"Update refused");return next();
    }).catch(function(){online=false;flushing=false;draw();});
  }
  return next();
}

/* ---------- what the screen shows = server state + updates still waiting in the queue ---------- */
function pendingFor(kind,key){
  return queue().filter(function(x){return x.ev&&((kind==="job"&&x.action==="t_job"&&x.ev.dutyId===key)||(kind==="tool"&&x.action==="t_tool"&&x.ev.toolId===key));});
}
function jobView(j){
  var st=j.status,jcc=j.jcc,pend=false;
  pendingFor("job",j.id).forEach(function(x){pend=true;
    if(x.ev.act==="start"&&st==="Pending")st="In Progress";
    if(x.ev.act==="complete"){st="Completed";jcc=x.ev.jcc;}});
  return {st:st,jcc:jcc,pend:pend};
}
function toolView(t){
  var holder=t.holder,holderId=t.holderId,since=t.since,pend=false;
  pendingFor("tool",t.id).forEach(function(x){pend=true;
    if(x.ev.act==="out"){holder=cfg.name;holderId="me";since=x.ev.clientTs;}
    if(x.ev.act==="return"){holder="";holderId="";}});
  var mine=holder&&(holderId==="me"||holder===cfg.name);
  return {holder:holder,mine:mine,since:since,pend:pend,site:t.site};
}

/* ---------- screens ---------- */
function draw(force){
  if(!force&&(CF||SD||MR)&&tab==='chk'&&document.querySelector('main .cf')){var hs=document.querySelector('header small');if(hs){var pq0=queue().length;hs.textContent=S?(S.today+(online?'':' \u00b7 offline')+(pq0?' \u00b7 '+pq0+' waiting to send':'')):'';}return;}
  if(!cfg.url){return drawSetup();}
  if(cfg.name&&cfg.pin&&!S){app.innerHTML='<div class="center card"><p class="sub">Loading your jobs\u2026</p></div>';return;}
  if(!cfg.name||!cfg.pin||!S){return drawLogin();}
  var pq=queue().length;
  var held=S.tools.filter(function(t){return toolView(t).mine;});
  var h='<header><h1>'+esc(S.tech)+'<small>'+esc(S.today)+(online?'':' · offline')+(pq?' · '+pq+' waiting to send':'')+'</small></h1>'
    +'<button id="bRef">Refresh</button><button id="bOut">Log out</button></header>'
    +'<nav><button data-t="jobs" aria-selected="'+(tab==="jobs")+'">Jobs</button>'
    +'<button data-t="duty" aria-selected="'+(tab==="duty")+'">Duty</button>'
    +'<button data-t="amc" aria-selected="'+(tab==="amc")+'">AMC</button>'
    +'<button data-t="gmc" aria-selected="'+(tab==="gmc")+'">GMC</button>'
    +'<button data-t="chk" aria-selected="'+(tab==="chk")+'">Checklist</button>'
    +'<button data-t="tools" aria-selected="'+(tab==="tools")+'">Tools</button>'
    +'<button data-t="hist" aria-selected="'+(tab==="hist")+'">History</button></nav><main>';
  if(!online)h+='<div class="banner b-warn">No signal. Your updates are saved on this phone and will send when the signal returns.</div>';
  if(held.length&&tab!=="tools")h+='<div class="banner b-warn">You still hold: <b>'+held.map(function(t){return esc(t.name);}).join(", ")+'</b>. Return it in the Tools tab when you finish.</div>';
  h+= tab==="jobs"?viewJobs():(tab==="chk"?viewChk():tab==="tools"?viewTools():(tab==="hist"?viewHist():(tab==="duty"?viewDuty():viewList(tab))));
  h+='</main>';
  app.innerHTML=h;
  wire();
}
function drawSetup(){
  app.innerHTML='<div class="center card"><h3>GSSC Technician</h3><p class="sub">Open the link your supervisor sent you. It sets this app up for you. If you only see this message, ask him to send the link again.</p></div>';
}
function drawLogin(){
  if(names===null){app.innerHTML='<div class="center card"><p class="sub">Loading…</p></div>';loadNames();return;}
  var opts='<option value="">Select your name</option>'+names.map(function(n){return '<option'+(n===cfg.name?' selected':'')+'>'+esc(n)+'</option>';}).join("");
  app.innerHTML='<div class="center"><div class="card"><h3>GSSC Technician</h3><p class="sub">Log in to see your jobs and tools.</p>'
    +(loginErr?'<div class="banner b-bad" style="margin-top:12px">'+esc(loginErr)+'</div>':'')
    +'<label>Name</label><select id="lName">'+opts+'</select>'
    +'<label>PIN</label><input id="lPin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8">'
    +'<div class="chk" style="border:0"><input type="checkbox" id="lStay"'+(cfg.stay?' checked':'')+'><label style="margin:0;color:var(--ink)" for="lStay">Stay logged in on this phone</label></div>'
    +'<button class="btn wide" id="lGo">Log in</button></div>'
    +(names.length?'':'<div class="banner b-info">No names yet. Your supervisor must set your PIN first.</div>')+'</div>';
  el("lGo").onclick=doLogin;
  el("lPin").onkeydown=function(e){if(e.key==="Enter")doLogin();};
}
function doLogin(){
  var n=el("lName").value,p=el("lPin").value.trim();
  if(!n||!p){loginErr="Select your name and enter your PIN.";return drawLogin();}
  cfg.name=n;cfg.pin=p;cfg.stay=el("lStay").checked;loginErr="";
  el("lGo").disabled=true;el("lGo").textContent="Checking…";
  post(auth({action:"t_state"})).then(function(r){
    if(!r||!r.ok){cfg.pin="";loginErr=r&&r.error?r.error:"Login failed";drawLogin();return;}
    S=r;lastSync=Date.now();lsSet(S_KEY,S);saveCfg();draw();flush();
  }).catch(function(){cfg.pin="";loginErr="No connection. Check your signal.";drawLogin();});
}

function pillCls(st){
  if(st==="Completed")return "p-Completed";
  if(st==="Submitted"||st==="In Progress"||st==="Ongoing")return "p-In";
  if(st==="Balance Work")return "p-out";
  if(st==="Returned")return "p-bad";
  return "p-Pending";
}
function linkedRow(j){
  var p=String(j.ref||"").split("|");
  if(p.length<2||(p[0]!=="amc"&&p[0]!=="gmc"))return null;
  var r=(S[p[0]]||[]).filter(function(y){return y.id===p[1];})[0];
  return r?{kind:p[0],row:r}:null;
}
function viewJobs(){
  if(!S.jobs.length)return '<div class="empty">No jobs assigned to you for today.<br>Pull Refresh if your supervisor just added one.</div>';
  return S.jobs.map(function(j){
    var v=jobView(j),L=linkedRow(j),rv=L?rowView(L.kind,L.row):null,st=v.st;
    if(rv&&(rv.st==="Submitted"||rv.st==="Completed"||rv.st==="Balance Work"||rv.st==="Returned"))st=rv.st;
    var btn="";
    if(v.st==="Pending"&&st==="Pending")btn='<button class="btn" data-start="'+esc(j.id)+'">Start</button>';
    if(st!=="Completed"&&st!=="Submitted")btn+='<button class="btn go" data-done="'+esc(j.id)+'">'+(L?"Update / complete":"Complete")+'</button>';
    return '<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><h3>'+esc(j.site||"Job")+'</h3><span class="pill '+pillCls(st)+'">'+esc(st)+'</span></div>'
      +'<div class="sub">'+esc(dshort(j.date))+(j.activity?' \u00b7 '+esc(j.activity):'')+(j.location?' \u00b7 '+esc(j.location):'')+'</div>'
      +(j.info?'<div style="margin-top:6px">'+esc(j.info)+'</div>':'')
      +(j.items&&j.items.length?'<div class="sub" style="margin-top:6px">Scope: '+j.items.length+' item(s)</div>':'')
      +(j.remarks?'<div class="sub" style="margin-top:6px">Note: '+esc(j.remarks)+'</div>':'')
      +(rv?rowNotes(rv):'')
      +(!L&&st==="Completed"&&v.jcc?'<div style="margin-top:8px"><b>JCC:</b> '+esc(v.jcc)+(j.sr?' \u00b7 <b>SR:</b> '+esc(j.sr):'')+'</div>':'')
      +(v.pend?'<div class="pend">Waiting to send\u2026</div>':'')
      +(btn?'<div class="row">'+btn+'</div>':'')+'</div>';
  }).join("");
}
function rowView(kind,r){
  var o={st:r.status,jcc:r.jcc,dd:r.doneDate,by:r.by,pend:false,remaining:r.remaining||"",note:r.note||"",comment:r.comment||"",
    result:r.result||"",progress:r.progress||""};
  queue().forEach(function(x){
    if(x.action==="t_row"&&x.ev.rowKind===kind&&x.ev.rowId===r.id){
      o.pend=true;o.st="Submitted";o.jcc=x.ev.jcc;o.dd=x.ev.doneDate;o.by=cfg.name;o.result=x.ev.result||"complete";o.remaining=x.ev.remaining||"";o.comment="";}});
  o.done=o.st==="Completed";
  return o;
}
/* the lines under a job card that explain where it stands */
function rowNotes(v){
  var h="";
  if(v.st==="Returned")h+='<div class="banner b-bad" style="margin-top:8px">Returned by supervisor'+(v.comment?': '+esc(v.comment):'')+'. Please update again.</div>';
  if(v.st==="Submitted")h+='<div class="banner b-info" style="margin-top:8px">'+(v.result==="partial"?'Partly done sent. ':'Sent as completed. ')+'Waiting for your supervisor to verify.'+(v.remaining?'<br>Remaining: '+esc(v.remaining):'')+'</div>';
  if(v.st==="Balance Work")h+='<div class="banner b-warn" style="margin-top:8px">Balance work'+(v.remaining?': '+esc(v.remaining):'')+'</div>';
  if(v.progress)h+='<div class="sub" style="margin-top:8px"><b>Supervisor note:</b> '+esc(v.progress)+'</div>';
  if(v.st==="Completed")h+='<div style="margin-top:8px">'+(v.dd?'<b>Done:</b> '+esc(dshort(v.dd)):'')+(v.jcc?' \u00b7 <b>JCC:</b> '+esc(v.jcc):'')+(v.by?' \u00b7 <b>By:</b> '+esc(v.by):'')+'</div>';
  return h;
}
function viewList(kind){
  return '<input type="search" id="lq" placeholder="Search '+(kind==="amc"?"site or AMC no":"GMC no, client or job")+'" value="'+esc(LQ[kind])+'" autocomplete="off">'
    +'<select id="lf" style="margin-top:8px">'
    +[["open","Not completed"],["sub","Waiting for verification"],["done","Completed"],["all","All"]].map(function(o){return '<option value="'+o[0]+'"'+(LF[kind]===o[0]?" selected":"")+'>'+o[1]+'</option>';}).join("")
    +'</select><div id="lst" style="margin-top:12px">'+listHtml(kind)+'</div>';
}
function listHtml(kind){
  var q=LQ[kind].trim().toLowerCase(),f=LF[kind],out=[],total=0;
  (S[kind]||[]).forEach(function(r){
    var v=rowView(kind,r);
    if(f==="open"&&v.done)return;if(f==="done"&&!v.done)return;if(f==="sub"&&v.st!=="Submitted")return;
    var hay=(kind==="amc"?[r.no,r.site,r.system,r.serv]:[r.no,r.client,r.desc]).join(" ").toLowerCase();
    if(q&&hay.indexOf(q)<0)return;
    total++;if(out.length>=80)return;
    var mo=String(r.month||"");
    var title=kind==="amc"?(r.site||"AMC"):(r.client||"GMC");
    var line=kind==="amc"?(esc(r.no)+(r.serv?" \u00b7 "+esc(r.serv):"")+(r.system?" \u00b7 "+esc(r.system):"")+(r.sched?" \u00b7 "+esc(dshort(r.sched)):""))
      :(esc(r.no)+(r.desc?" \u2014 "+esc(r.desc):"")+(r.sched?" \u00b7 "+esc(dshort(r.sched)):""));
    out.push({m:mo,h:'<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><h3>'+esc(title)+'</h3><span class="pill '+pillCls(v.st)+'">'+esc(v.st)+'</span></div>'
      +'<div class="sub">'+line+'</div>'
      +(kind==="gmc"&&r.items.length?'<div class="sub" style="margin-top:4px">Scope: '+r.items.length+' item(s)</div>':'')
      +rowNotes(v)
      +(v.pend?'<div class="pend">Waiting to send\u2026</div>':'')
      +((v.done||v.st==="Submitted")?'':'<div class="row"><button class="btn go" data-row="'+kind+'|'+esc(r.id)+'">Update / mark completed</button></div>')+'</div>'});
  });
  if(!out.length)return '<div class="empty">Nothing found.</div>';
  out.sort(function(a,b){return a.m<b.m?1:(a.m>b.m?-1:0);});
  var html="",lastM=null;
  out.forEach(function(o){if(o.m!==lastM){lastM=o.m;html+='<div class="mh">'+esc(monthLabel(o.m))+'</div>';}html+=o.h;});

          h+='<div class="card">'+(b.lab?'<h3>'+esc(b.rows[ri])+'</h3>':'<h3>'+esc(b.cols[0]||"Row")+' '+(ri+1)+'</h3>');
          for(var ci=(b.lab?1:0);ci<b.cols.length;ci++){
            var k="s"+si+"b"+bi+"r"+ri+"c"+ci;

      }});});

  return h;
}
function sdCount(){var n=0;for(var k in SD.data)if(SD.data[k])n++;return n;}

/* ---------- material requirement list after service, with photos ---------- */
function mrSaveLocal(){try{if(MR)localStorage.setItem(MRK,JSON.stringify({f:MR,ro:MRRO}));else localStorage.removeItem(MRK);}catch(e){}}
function mrListHtml(){
  var fl=(S.mrls||[]).slice();
  queue().forEach(function(x){if(x.action==="t_mrl_save"&&x.ev&&x.ev.form&&!fl.some(function(y){return y.id===x.ev.form.id;})){var f=x.ev.form;fl.unshift({id:f.id,site:f.site,date:f.date,status:f.status,n:(f.items||[]).length});}});

  return '<h4 style="margin:6px 0;font-size:14px;color:var(--navy)">Material lists</h4>'+fl.map(function(f){
    return '<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><h3>'+esc(f.site)+'</h3><span class="pill '+(f.status==="final"?'p-Completed':'p-out')+'">'+(f.status==="final"?'Submitted':'Draft')+'</span></div>'
      +'<div class="sub">Material list · '+esc(dshort(f.date))+' · '+(f.n||0)+' item(s)</div>'
      +'<div class="row"><button class="btn sec" data-mropen="'+esc(f.id)+'">'+(f.status==="final"?'View':'Continue')+'</button></div></div>';}).join("")+'<h4 style="margin:14px 0 6px;font-size:14px;color:var(--navy)">Checklists</h4>';
}
function mrNewModal(){
  var sites=siteChoices();
  modal('<h2>Material list</h2><div class="sub">Items needed after service, for the office quotation. Add photos of each item.</div>'
    +'<label>Site</label><input id="mSite" list="mSiteList" autocomplete="off" placeholder="Type or choose site"><datalist id="mSiteList">'+sites.map(function(n){return '<option value="'+esc(n)+'">';}).join("")+'</datalist>'
    +'<div id="nErr" class="banner b-bad" style="display:none;margin-top:12px"></div>'
    +'<div class="row"><button class="btn go" style="flex:1" id="mOk">Start</button><button class="btn sec" id="mNo">Cancel</button></div>',
  function(m){

    el("mOk").onclick=function(){
      var site=el("mSite").value.trim();if(!site){var e=el("nErr");e.textContent="Choose or type the site.";e.style.display="block";return;}
      var amc="";(S.amc||[]).forEach(function(r){if(!amc&&r.site===site&&r.status!=="Completed")amc=r.no||"";});
      MR={id:uid().slice(0,16),site:site,date:S.today,status:"draft",hdr:{client:site,loc:"",rep:"",amc:amc,svcno:"",sys:"",tech:cfg.name,sup:"",sub:S.today},items:[{d:"",m:"",u:"Nos",q:"",r:"",ph:[],th:[],up:[]}]};
      MRRO=false;mrSaveLocal();m.remove();draw(true);window.scrollTo(0,0);
    };
  });
}
var MRH=[["client","Client / facility"],["loc","Location / area"],["rep","Report number"],["amc","AMC number"],["svcno","Service no. / visit"],["sys","System serviced"],["tech","Service technician"],["sup","Site supervisor"]];
function mrHtml(){
  var ro=MRRO;
  var h='<div class="cf"><div class="row" style="margin-top:0"><button class="btn sec" id="mrBack">← Back</button></div>'
    +'<h3 style="margin:12px 0 2px">Material requirement list</h3><div class="sub">After service · for quotation · '+esc(MR.site)+'</div>'
    +'<div class="card" style="margin-top:12px"><label style="margin-top:0">Date of service</label><input type="date" data-mh="_date" max="'+esc(S.today)+'" value="'+esc(MR.date)+'"'+(ro?' disabled':'')+'>'
    +MRH.map(function(f){return '<label>'+f[1]+'</label><input data-mh="'+f[0]+'" value="'+esc(MR.hdr[f[0]]||"")+'"'+(ro?' disabled':'')+'>';}).join("")+'</div>'
    +'<h4>Items required</h4><div id="mrItems">'+mrItemsHtml()+'</div>'
    +(ro?'':'<button class="btn sec wide" id="mrAdd">+ Add item</button>')
    +'<div class="sub" style="margin-top:12px">Write the quantity clearly with unit. Add a photo or nameplate picture of each item.</div>'
    +'<div class="bar"><span class="sub" style="flex:1" id="mrProg"></span>'+(ro?'':'<button class="btn sec" id="mrSave">Save draft</button><button class="btn go" id="mrSub">Submit</button>')+'</div></div>';
  return h;
}
function mrItemsHtml(){
  var ro=MRRO;
  return MR.items.map(function(it,i){
    var th=(it.th||[]),np=(it.ph||[]).length+(it.up||[]).length;
    return '<div class="it fr" data-it="'+i+'"><b>Item '+(i+1)+'</b>'
      +'<label>Description of material</label><textarea data-mi="'+i+'|d"'+(ro?' disabled':'')+'>'+esc(it.d)+'</textarea>'
      +'<label>Model / size / brand</label><input data-mi="'+i+'|m" value="'+esc(it.m)+'"'+(ro?' disabled':'')+'>'
      +'<div class="g2"><div><label>Unit</label><select data-mi="'+i+'|u"'+(ro?' disabled':'')+'>'+["Nos","Mtr","Set","Lot","Roll","Litre"].map(function(u){return '<option'+(it.u===u?' selected':'')+'>'+u+'</option>';}).join("")+'</select></div>'
      +'<div><label>Qty</label><input data-mi="'+i+'|q" inputmode="decimal" value="'+esc(it.q)+'"'+(ro?' disabled':'')+'></div></div>'
      +'<label>Remarks / required for</label><input data-mi="'+i+'|r" value="'+esc(it.r)+'"'+(ro?' disabled':'')+'>'
      +'<div class="row" style="margin-top:10px">'+th.map(function(t,k){return '<img src="'+t+'" style="width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)">';}).join("")
      +((it.up||[]).length?'<span class="pend">'+it.up.length+' photo(s) not sent yet</span>':'')
      +(np>th.length?'<span class="sub">'+(np-th.length-(it.up||[]).length)+' saved photo(s)</span>':'')+'</div>'
      +(ro?'':'<div class="row"><label class="btn sec" style="margin:0;display:inline-block;color:var(--navy)">📷 '+(np?'Add photo':'Take photo')+'<input type="file" accept="image/*" capture="environment" data-ph="'+i+'" style="display:none"></label>'
        +(np?'<button class="btn sec" data-phx="'+i+'">Remove photos</button>':'')+(MR.items.length>1?'<button class="btn sec" data-itx="'+i+'">Remove item</button>':'')+'</div>')+'</div>';}).join("");
}
function photoPrep(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      function mk(max,q){var sc=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c.toDataURL("image/jpeg",q);}
      var full=mk(1100,0.65),th=mk(160,0.5);URL.revokeObjectURL(url);res({full:full,th:th});};
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error("Could not read the photo"));};
    img.src=url;});
}
function photoUpload(site,u){
  return post(auth({action:"t_photo",pid:u.pid,site:site,data:u.full.replace(/^data:image\/jpeg;base64,/,"")})).then(function(r){
    if(r&&r.ok)return r.fileId;throw new Error((r&&r.error)||"upload failed");});
}
function mrFlushPhotos(){
  var jobs=[];
  MR.items.forEach(function(it){(it.up||[]).slice().forEach(function(u){
    jobs.push(photoUpload(MR.site,u).then(function(id){it.ph=it.ph||[];it.ph.push(id);it.up=it.up.filter(function(x){return x!==u;});}).catch(function(){}));});});
  return Promise.all(jobs).then(function(){mrSaveLocal();var anyLeft=MR.items.some(function(it){return (it.up||[]).length;});return !anyLeft;});
}
function wireMr(){
  var root=document.querySelector(".cf");if(!root)return;
  function prog(){var e=el("mrProg");if(e)e.textContent=MR.items.filter(function(i){return i.d.trim();}).length+" item(s)";}
  prog();
  el("mrBack").onclick=function(){
    if(!MRRO&&!confirm("Leave this list? What you typed stays on this phone. Press Save draft first to send it."))return;
    MR=null;mrSaveLocal();draw(true);};
  Array.prototype.forEach.call(root.querySelectorAll("[data-mh]"),function(x){x.oninput=x.onchange=function(){
    if(x.dataset.mh==="_date")MR.date=x.value;else MR.hdr[x.dataset.mh]=x.value;mrSaveLocal();};});
  function wireItems(){
    Array.prototype.forEach.call(root.querySelectorAll("[data-mi]"),function(x){x.oninput=x.onchange=function(){
      var p=x.dataset.mi.split("|");MR.items[+p[0]][p[1]]=x.value;mrSaveLocal();prog();};});
    Array.prototype.forEach.call(root.querySelectorAll("[data-ph]"),function(x){x.onchange=function(){
      var i=+x.dataset.ph,it=MR.items[i],f=x.files&&x.files[0];if(!f)return;
      if((it.ph||[]).length+(it.up||[]).length>=3){toast("Maximum 3 photos for one item.");return;}
      toast("Adding photo…");
      photoPrep(f).then(function(pp){
        var u={pid:uid(),full:pp.full};it.th=it.th||[];it.th.push(pp.th);
        return photoUpload(MR.site,u).then(function(id){it.ph=it.ph||[];it.ph.push(id);toast("Photo saved");})
          .catch(function(){it.up=it.up||[];it.up.push(u);toast("No signal. Photo kept on this phone and will send later.");});
      }).then(function(){mrSaveLocal();el("mrItems").innerHTML=mrItemsHtml();wireItems();})
        .catch(function(e){toast(e.message||"Photo failed");});};});
    Array.prototype.forEach.call(root.querySelectorAll("[data-phx]"),function(x){x.onclick=function(){
      var it=MR.items[+x.dataset.phx];it.ph=[];it.th=[];it.up=[];mrSaveLocal();el("mrItems").innerHTML=mrItemsHtml();wireItems();};});
    Array.prototype.forEach.call(root.querySelectorAll("[data-itx]"),function(x){x.onclick=function(){
      MR.items.splice(+x.dataset.itx,1);mrSaveLocal();el("mrItems").innerHTML=mrItemsHtml();wireItems();prog();};});
  }
  wireItems();
  var b=el("mrAdd");if(b)b.onclick=function(){MR.items.push({d:"",m:"",u:"Nos",q:"",r:"",ph:[],th:[],up:[]});mrSaveLocal();el("mrItems").innerHTML=mrItemsHtml();wireItems();prog();};
  function sendMr(status){
    var f=JSON.parse(JSON.stringify(MR));f.status=status;
    f.items=f.items.map(function(it){return {d:it.d,m:it.m,u:it.u,q:it.q,r:it.r,ph:it.ph||[]};});
    var q=queue().filter(function(x){return !(x.action==="t_mrl_save"&&x.ev&&x.ev.form&&x.ev.form.id===MR.id);});setQueue(q);
    send("t_mrl_save",{form:f});
  }
  b=el("mrSave");if(b)b.onclick=function(){mrFlushPhotos().then(function(){sendMr("draft");toast("Saved");el("mrItems").innerHTML=mrItemsHtml();wireItems();});};
  b=el("mrSub");if(b)b.onclick=function(){
    var items=MR.items.filter(function(i){return i.d.trim();});
    if(!items.length){toast("Add at least one item.");return;}
    if(items.some(function(i){return !String(i.q).trim();})){toast("Enter the quantity for every item.");return;}
    mrFlushPhotos().then(function(ok){
      if(!ok){toast("Some photos are not sent yet. Get signal, then press Submit again.");el("mrItems").innerHTML=mrItemsHtml();wireItems();return;}
      if(!confirm("Submit this list to the office? You cannot change it after this."))return;
      MR.items=MR.items.filter(function(i){return i.d.trim();});
      sendMr("final");MR=null;mrSaveLocal();draw(true);toast("Submitted. Your supervisor can see it now.");});};
}
function openMr(id){
  var saved=lsGet(MRK,null);
  if(saved&&saved.f&&saved.f.id===id){MR=saved.f;MRRO=!!saved.ro;draw(true);return;}
  var q=queue().filter(function(x){return x.action==="t_mrl_save"&&x.ev&&x.ev.form&&x.ev.form.id===id;})[0];
  if(q){MR=JSON.parse(JSON.stringify(q.ev.form));MR.items.forEach(function(i){i.th=i.th||[];i.up=i.up||[];});MRRO=MR.status==="final";draw(true);return;}
  post(auth({action:"t_mrl_get",id:id})).then(function(r){
    if(!r||!r.ok){toast((r&&r.error)||"Could not open");return;}
    MR=r.form;MR.items.forEach(function(i){i.th=[];i.up=[];});MRRO=MR.status==="final";mrSaveLocal();draw(true);window.scrollTo(0,0);
  }).catch(function(){toast("No connection");});
}
function findJob(id){return S.jobs.filter(function(j){return j.id===id;})[0];}
function findTool(id){return S.tools.filter(function(t){return t.id===id;})[0];}

function modal(html,onReady){
  var m=document.createElement("div");m.className="modalbg";m.innerHTML='<div class="modal">'+html+'</div>';
  document.body.appendChild(m);
  m.onclick=function(e){if(e.target===m)m.remove();};
  onReady(m);return m;
}
function gateItems(m,total,btnId,okLabel){
  var btn=el(btnId),hint=el("mGate");
  function upd(){var n=m.querySelectorAll("[data-i]:checked").length,ok=n===total;
    btn.disabled=!ok;btn.textContent=ok?okLabel:okLabel+" ("+n+"/"+total+" ticked)";
    if(hint)hint.style.display=ok?"none":"block";}
  Array.prototype.forEach.call(m.querySelectorAll("[data-i]"),function(c){c.onchange=upd;});upd();
}
function rowModal(kind,r){
  var items=(kind==="gmc"?r.items:[]);
  var il=items.map(function(t,i){return '<div class="chk"><input type="checkbox" data-i="'+i+'" id="ci'+i+'"><label style="margin:0;color:var(--ink)" for="ci'+i+'">'+esc(t)+'</label></div>';}).join("");
  var title=kind==="amc"?(r.site+" \u00b7 "+r.no+(r.serv?" \u00b7 "+r.serv:"")):(r.no+" \u00b7 "+r.client);
  modal('<h2>Update job</h2><div class="sub">'+esc(title)+'</div>'
    +'<label>Work status</label><select id="mRes"><option value="complete">All done (completed)</option><option value="partial">Partly done (some remaining)</option></select>'
    +(il?'<label>Scope items (tick each one done)</label>'+il:'')
    +'<div id="mGate" class="banner b-warn" style="margin-top:10px;display:none">Tick every item to mark this job completed. Or choose Partly done and write what is remaining.</div>'
    +'<div id="mRemBox" style="display:none"><label>What is remaining (required)</label><textarea id="mRemain"></textarea></div>'
    +'<label>Date of work</label><input type="date" id="mDate" value="'+esc(S.today)+'" max="'+esc(S.today)+'">'
    +'<label id="mJccL">JCC number (required when all done)</label><input id="mJcc" autocapitalize="characters" autocomplete="off">'
    +'<label>SR number</label><input id="mSr" autocapitalize="characters" autocomplete="off">'
    +'<label>What was done / remarks</label><textarea id="mRem"></textarea>'
    +'<div class="sub" style="margin-top:10px">Updated by: <b>'+esc(cfg.name)+'</b>. Your supervisor checks it before it moves to Completed.</div>'
    +'<div id="mErr" class="banner b-bad" style="display:none;margin-top:12px"></div>'
    +'<div class="row"><button class="btn go" style="flex:1" id="mOk">Mark completed</button><button class="btn sec" id="mNo">Cancel</button></div>',
  function(m){
    var touched=false,btn=el("mOk");
    el("mRemain").oninput=function(){touched=true;};
    function upd(){
      var part=el("mRes").value==="partial",boxes=m.querySelectorAll("[data-i]"),n=m.querySelectorAll("[data-i]:checked").length;
      var ok=part||!items.length||n===items.length;
      btn.disabled=!ok;
      btn.textContent=part?"Send update":(ok?"Mark completed":"Mark completed ("+n+"/"+items.length+" ticked)");
      el("mRemBox").style.display=part?"block":"none";
      el("mGate").style.display=(!part&&items.length&&!ok)?"block":"none";
      el("mJccL").textContent=part?"JCC number (if you have it)":"JCC number (required when all done)";
      if(part&&items.length&&!touched){
        var left=[];Array.prototype.forEach.call(boxes,function(c){if(!c.checked)left.push(items[+c.dataset.i]);});
        el("mRemain").value=left.join("; ");}
    }
    el("mRes").onchange=upd;
    Array.prototype.forEach.call(m.querySelectorAll("[data-i]"),function(c){c.onchange=upd;});
    upd();
    el("mNo").onclick=function(){m.remove();};
    btn.onclick=function(){
      var part=el("mRes").value==="partial",jcc=el("mJcc").value.trim(),dd=el("mDate").value,rem=el("mRemain").value.trim();
      var bad=function(t){var e=el("mErr");e.textContent=t;e.style.display="block";};
      if(!dd)return bad("Pick the date.");
      if(part&&!rem)return bad("Write what is remaining.");
      if(!part&&!jcc)return bad("Enter the JCC number to mark this completed.");
      var ev={rowKind:kind,rowId:r.id,result:part?"partial":"complete",doneDate:dd,jcc:jcc,sr:el("mSr").value.trim(),remarks:el("mRem").value.trim(),remaining:part?rem:""};
      if(items.length)ev.items={done:m.querySelectorAll("[data-i]:checked").length,total:items.length};
      m.remove();send("t_row",ev);
    };
  });
}
function completeModal(j){
  var items=(j.items||[]).map(function(t,i){return '<div class="chk"><input type="checkbox" data-i="'+i+'" id="ci'+i+'"><label style="margin:0;color:var(--ink)" for="ci'+i+'">'+esc(t)+'</label></div>';}).join("");
  modal('<h2>Complete job</h2><div class="sub">'+esc(j.site)+'</div>'
    +(items?'<label>Scope items done</label>'+items+'<div id="mGate" class="banner b-warn" style="margin-top:10px">Tick every item to complete this job. If work is not finished, leave it: nothing is updated.</div>':'')
    +'<label>JCC number (required)</label><input id="mJcc" autocapitalize="characters" autocomplete="off">'
    +'<label>SR number</label><input id="mSr" autocapitalize="characters" autocomplete="off">'
    +'<label>Remarks</label><textarea id="mRem"></textarea>'
    +'<div id="mErr" class="banner b-bad" style="display:none;margin-top:12px"></div>'
    +'<div class="row"><button class="btn go" style="flex:1" id="mOk">Complete</button><button class="btn sec" id="mNo">Cancel</button></div>',
  function(m){
    el("mNo").onclick=function(){m.remove();};
    if(items)gateItems(m,(j.items||[]).length,"mOk","Complete");
    el("mOk").onclick=function(){
      var jcc=el("mJcc").value.trim();
      if(!jcc){var e=el("mErr");e.textContent="Enter the JCC number to complete this job.";e.style.display="block";return;}
      var done=m.querySelectorAll("[data-i]:checked").length;
      var ev={act:"complete",dutyId:j.id,ref:j.ref,site:j.site,jcc:jcc,sr:el("mSr").value.trim(),remarks:el("mRem").value.trim()};
      if(items)ev.items={done:done,total:(j.items||[]).length};
      m.remove();send("t_job",ev);
    };
  });
}
function outModal(t){
  var sites=(S.sites||[]).map(function(s){return '<option value="'+esc(s)+'">';}).join("");
  modal('<h2>Take out</h2><div class="sub">'+esc(t.name)+'</div>'
    +'<label>Site where you will use it</label><input id="mSite" list="siteList" autocomplete="off"><datalist id="siteList">'+sites+'</datalist>'
    +'<div class="row"><button class="btn" style="flex:1" id="mOk">Take out</button><button class="btn sec" id="mNo">Cancel</button></div>',
  function(m){
    el("mNo").onclick=function(){m.remove();};
    el("mOk").onclick=function(){var site=el("mSite").value.trim();m.remove();send("t_tool",{act:"out",toolId:t.id,site:site});};
  });
}
function retModal(t){
  modal('<h2>Return</h2><div class="sub">'+esc(t.name)+'</div>'
    +'<label>Condition</label><select id="mCond"><option>OK</option><option>Damaged</option></select>'
    +'<label>Note (optional)</label><textarea id="mNote"></textarea>'

    el("mNo").onclick=function(){m.remove();};

  });
}
