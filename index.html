/* ================= import ================= */
function norm(s){return String(s==null?"":s).toLowerCase().replace(/[^a-z0-9]/g,"");}
function pickCol(headers,cands){
  for(var i=0;i<headers.length;i++){var h=norm(headers[i]);
    for(var j=0;j<cands.length;j++)if(h===norm(cands[j]))return i;}
  for(var i2=0;i2<headers.length;i2++){var h2=norm(headers[i2]);
    for(var j2=0;j2<cands.length;j2++){var c=norm(cands[j2]);if(c&&h2.indexOf(c)>-1)return i2;}}
  return -1;}
function findHeader(rows,must){
  for(var i=0;i<Math.min(rows.length,15);i++){
    var hit=0;must.forEach(function(m){if(pickCol(rows[i],[m])>-1)hit++;});
    if(hit>=must.length)return i;}
  return -1;}
var MSHORT=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
function xlDate(v){
  if(v==null||v==="")return "";
  if(v instanceof Date)return iso(v);
  var s0=String(v).trim();
  var dm=s0.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(dm)return dm[3]+"-"+pad(+dm[2])+"-"+pad(+dm[1]);
  var s=s0.split("/").pop().trim();
  var m=s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
  if(m)return m[3]+"-"+pad(+m[2])+"-"+pad(+m[1]);
  m=s.match(/^(\d{1,2})[- ]([A-Za-z]{3})[A-Za-z]*[- ](\d{4})$/);
  if(m){var ix=MSHORT.indexOf(m[2].toLowerCase());if(ix>-1)return m[3]+"-"+pad(ix+1)+"-"+pad(+m[1]);}
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return m[1]+"-"+pad(+m[2])+"-"+pad(+m[3]);
  if(/^\d+(\.\d+)?$/.test(s)){var d=new Date(Date.UTC(1899,11,30)+(+s)*864e5);return iso(d);}
  return "";}
function detectMonth(label){
  var s=String(label||"").toLowerCase();
  var y=s.match(/(20\d{2})/),year=y?y[1]:state.curMonth.slice(0,4);
  var m=s.match(/(20\d{2})[^0-9]?(0[1-9]|1[0-2])(?![0-9])/);
  if(m)return m[1]+"-"+m[2];
  m=s.match(/(?:^|[^0-9])(0[1-9]|1[0-2])[-_ ](20\d{2})/);
  if(m)return m[2]+"-"+m[1];
  for(var i=0;i<12;i++)if(s.indexOf(MSHORT[i])>-1)return year+"-"+pad(i+1);
  return "";}
function readWorkbook(file,cb){
  var fr=new FileReader();
  fr.onload=function(e){
    try{
      var wb=XLSX.read(new Uint8Array(e.target.result),{type:"array",cellDates:true});
      cb(wb.SheetNames.map(function(n){
        return {sheet:n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:"",raw:false})};}));
    }catch(err){toast("Could not read "+file.name+": "+err.message);cb([]);}};
  fr.readAsArrayBuffer(file);}
function textRows(txt){
  return txt.split(/\r?\n/).filter(function(l){return l.trim();}).map(function(l){
    return l.indexOf("\t")>-1?l.split("\t"):(l.indexOf(",")>-1?l.split(","):l.split(/\s{2,}/));});}

/* ---- AMC ---- */
function parseAmc(rows){
  var hi=findHeader(rows,["amc","site"]);
  if(hi<0)hi=findHeader(rows,["amc no"]);
  if(hi<0)return null;
  var H=rows[hi];
  var cNo=pickCol(H,["AMC No.","AMC No","AMC #","AMC Number"]),
      cSite=pickCol(H,["AMC SITE NAME","Site Name","Site","Customer","Client"]),
      cSys=pickCol(H,["System"]),
      cServ=pickCol(H,["Service No.","Service No","Services"]),
      cFreq=pickCol(H,["Type of Service","Frequency","Service Type"]),
      cStat=pickCol(H,["Service Status","Job Status","Completion Status","Status","Completed"]),
      cSr=pickCol(H,["SR No.","SR No","Service Report No","Report No","SR"]),
      cDate=pickCol(H,["Service Date","Date of Service","Completed On","Date"]),
      cTech=pickCol(H,["Technician","Technicians","Manpower","Attended by"]),
      cRem=pickCol(H,["Remarks"]);
  if(cRem<0&&hi>0)cRem=pickCol(rows[hi-1],["Remarks"]);
  if(cStat<0&&hi>0)cStat=pickCol(rows[hi-1],["Service Status","Job Status","Status","Completed"]);
  if(cNo<0||cSite<0)return null;
  var out=[];
  for(var i=hi+1;i<rows.length;i++){
    var r=rows[i],no=String(r[cNo]||"").trim(),site=String(r[cSite]||"").trim();
    if(!no||!site||/^(total|grand total|shortage)(\s+(mandays|required( mandays)?|days))?\s*:?\s*$/i.test(site))continue;
    var rem=cRem>-1?String(r[cRem]||"").trim():"";
    var stTxt=cStat>-1?String(r[cStat]||"").trim():"";
    var sr=cSr>-1?String(r[cSr]||"").trim():"";
    if(/^[\u2014\u2013-]+$/.test(sr))sr="";
    var sd=cDate>-1?xlDate(r[cDate]):"";
    var tx=cTech>-1?String(r[cTech]||"").trim():"";
    if(/^[\u2014\u2013-]+$/.test(tx))tx="";
    out.push({amcNo:no,site:site,srNo:sr,servDate:sd,techText:tx,
      sheetStatus:statusFromText(stTxt)||statusFromText(rem),
      system:cSys>-1?String(r[cSys]||"").replace(/\n/g," ").trim():"",
      serviceNo:cServ>-1?String(r[cServ]||"").trim():"",
      freq:cFreq>-1?String(r[cFreq]||"").trim():"",
      remark:rem,
      contractStatus:/hold/i.test(rem)?"On Hold":(/renew/i.test(rem)?"Under Renewal":"Active")});}
  return out.length?out:null;}

      +' technician name(s) not yet on the team: <b>'+esc(unk.slice(0,10).join(", "))+(unk.length>10?" \u2026":"")
      +'</b></label></div>':'')
    +(withDate?'<div class="field"><label style="text-transform:none;letter-spacing:0;font-weight:400;font-size:13.5px">'
      +'<input type="checkbox" id="fDuty" style="width:auto;margin-right:6px">Also build duty records from the service '
      +'date and technicians, so the duty board shows the history</label></div>':'');
  openModal("Import monthly AMC lists",body,function(){
    var dflt=val("fSt");
    var dupMode=val("fDup")||"skip", skipped=0, updated=0;
    var rep=(dupMode==="replace");
    var addTEl=document.getElementById("fNewT"), dutyEl=document.getElementById("fDuty");
    var addT=addTEl?addTEl.checked:false, mkDuty=dutyEl?dutyEl.checked:false;
    Array.prototype.forEach.call(document.querySelectorAll("[data-mrow]"),function(s){
      entries[+s.dataset.mrow].month=s.value;});
    var months={},lines=0;
    entries.forEach(function(e){months[e.month]=1;});
    if(rep)state.amc=state.amc.filter(function(a){return !months[a.month];});
    var have={};state.amc.forEach(function(a){have[amcKey(a)]=a;});
    entries.forEach(function(e){
      e.recs.forEach(function(r){
        var c=null;state.contracts.forEach(function(x){if(x.amcNo===r.amcNo)c=x;});
        if(!c){c={id:uid(),amcNo:r.amcNo,site:r.site,system:r.system,manpower:0,days:0,manhours:0,
          freq:r.freq||"Quarterly",serviceNo:r.serviceNo,value:0,payment:"",
          contractStatus:r.contractStatus,location:"Dammam"};state.contracts.push(c);}
        var past=mIdx(e.month)<mIdx(mKey(today()));
        var fromSheet=r.sheetStatus||"";
        var ids=[],leftover=[];
        splitTechs(r.techText).forEach(function(n){
          var tt=matchTech(n);
          if(!tt&&addT){tt={id:uid(),name:n,trade:"",active:true};state.techs.push(tt);}
          if(tt)ids.push(tt.id);else leftover.push(n);});
        var st=r.contractStatus==="On Hold"?"On Hold":(fromSheet||(past?dflt:"Open"));
        var repSt=(st==="Report Pending Sign")?"Submitted"
          :(r.srNo?((st==="Completed")?"Signed / JCC received":"Submitted"):"Not submitted");
        var cs=(st==="Under Renewal")?"Under Renewal":((st==="On Hold")?"On Hold":r.contractStatus);
        var fresh={id:uid(),month:e.month,contractId:c.id,amcNo:r.amcNo,site:r.site,
          system:r.system||c.system,serviceNo:r.serviceNo,client:r.site,location:c.location||"Dammam",
          freq:r.freq||c.freq,contractStatus:cs,status:st,srNo:r.srNo||"",
          schedDate:r.servDate||"",doneDate:(st==="Completed")?(r.servDate||""):"",
          report:repSt,qtn:"Not required",techs:ids,techText:leftover.join(", "),notes:r.remark};
        var k=amcKey(fresh),old=have[k];
        if(old&&dupMode!=="add"){
          if(dupMode==="update"&&!amcSame(old,fresh)){
            fresh.id=old.id;
            for(var q=0;q<state.amc.length;q++)if(state.amc[q].id===old.id)state.amc[q]=fresh;
            have[k]=fresh;updated++;}
          else skipped++;
          return;}
        state.amc.push(fresh);have[k]=fresh;
        if(mkDuty&&r.servDate&&ids.length)
          state.duties.push({id:uid(),date:r.servDate,ref:"",siteText:r.amcNo+" \u00b7 "+r.site,
            activity:"AMC",location:c.location||"Dammam",techIds:ids,remarks:r.srNo?("SR "+r.srNo):""});
        lines++;});});
    var keys=Object.keys(months).sort();
    state.curMonth=keys[keys.length-1];
    closeModal();
    var msg=lines+" line(s) loaded across "+keys.length+" month(s)";
    if(updated)msg+=", "+updated+" updated";
    if(skipped)msg+=", "+skipped+" already stored";
    commit(msg);
  },"",true);
  var sf=document.getElementById("stFound");
  if(sf)sf.textContent=withSt?(withSt+" row(s) in these files already state a status."):"None of these rows state a status.";
  document.getElementById("modalRoot").addEventListener("change",function(e){
    if(e.target.dataset&&e.target.dataset.mrow!==undefined){
      var ix=+e.target.dataset.mrow,c=document.getElementById("ex"+ix);
      if(c)c.textContent=amcOf(e.target.value).length||"\u2014";}});
}

/* ---------- import straight from a Google Sheet link ---------- */
function gsId(u){var m=String(u||"").match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);return m?m[1]:"";}
function gsGid(u){var m=String(u||"").match(/[#&?]gid=([0-9]+)/);return m?m[1]:"";}
function gsFetch(url,cb){
  var id=gsId(url);
  if(!id)return cb(null,"That does not look like a Google Sheet link. It should contain /spreadsheets/d/");
  var gid=gsGid(url);
  var csv="https://docs.google.com/spreadsheets/d/"+id+"/gviz/tq?tqx=out:csv"+(gid?"&gid="+gid:"");
  fetch(csv,{credentials:"omit"}).then(function(r){
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.text();
  }).then(function(txt){
    if(txt.indexOf("<HTML")>-1||txt.indexOf("<!DOCTYPE")>-1)
      throw new Error("locked");
    var wb=XLSX.read(txt,{type:"string",cellDates:true,dateNF:"yyyy-mm-dd"});
    cb(wb.SheetNames.map(function(n){
      return {sheet:n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:"",raw:false})};}),null);
  }).catch(function(e){
    cb(null,e.message==="locked"
      ?"That sheet is private. In Google Sheets press Share, set \u201cAnyone with the link\u201d to Viewer, then try again \u2014 or use File \u203a Download \u203a Excel and import the file."
      :"Could not reach the sheet ("+e.message+"). Check the link, or download it as Excel instead.");});}
function gsModal(kind){
  var body='<div class="field"><label>Google Sheet link</label>'
    +'<input id="gsUrl" placeholder="https://docs.google.com/spreadsheets/d/..." autocomplete="off"></div>'
    +'<p class="hint">Open the sheet in your browser and copy the address bar. '
    +'The sheet must be shared as \u201cAnyone with the link \u2014 Viewer\u201d, otherwise it cannot be read. '
    +'If it stays private, use File \u203a Download \u203a Microsoft Excel and import that file instead.</p>'
    +'<div id="gsBusy" class="hint" style="display:none">Reading the sheet\u2026</div>';
  openModal("Import from Google Sheet",body,function(){
    var u=val("gsUrl");
    if(!u)return mErr("Paste the link first.");
    var bz=document.getElementById("gsBusy");if(bz)bz.style.display="";
    gsFetch(u,function(sheets,err){
      if(bz)bz.style.display="none";
      if(err)return mErr(err);
      var parse=(kind==="gmc"?parseGmc:(kind==="call"?parseCall:parseAmc));
      var usable=sheets.filter(function(s){return !!parse(s.rows);});
      if(!usable.length)return mErr(kind==="gmc"
        ?"No GMC table found in that sheet. It needs a client column and a GMC number column."
        :(kind==="call"
          ?"No on-call table found in that sheet. It needs a site column and a date or issue column."
          :"No AMC table found in that sheet. It needs an AMC number column and a site name column."));
      closeModal();
      if(kind==="call"){
        var cAll=[],cSrc="Google Sheet";
        usable.forEach(function(s){var r=parseCall(s.rows);if(r)cAll=cAll.concat(r);});
        callImportModal(cAll,cSrc);
        return;}
      if(kind==="gmc"){
        var all=[],sm="";
        usable.forEach(function(s){
          var r=parseGmc(s.rows);
          if(r){all=all.concat(r);sm=detectMonth(s.sheet)||sm;}});
        importGmcRecords(all,sm);
        return;}
      var entries=usable.map(function(s){
        return {label:"Google Sheet \u203a "+s.sheet,
          month:detectMonth(s.sheet)||state.curMonth,
          recs:parseAmc(s.rows)};});
      entries.sort(function(a,b){return a.month<b.month?-1:1;});
      amcBatchModal(entries);});
  },"",false,null,null);}

function importAmcFiles(files){
  var entries=[],left=files.length;
  if(!left)return;
  Array.prototype.forEach.call(files,function(f){
    readWorkbook(f,function(sheets){
      var usable=sheets.filter(function(s){return !!parseAmc(s.rows);});
      usable.forEach(function(s){
        var recs=parseAmc(s.rows);
        var m=detectMonth(s.sheet)||detectMonth(f.name)||state.curMonth;
        entries.push({label:f.name+(usable.length>1?" \u203a "+s.sheet:""),month:m,recs:recs});});
      if(--left===0){
        if(!entries.length)return toast("No AMC table found. The sheet needs an AMC number column and a site name column.");
        entries.sort(function(a,b){return a.month<b.month?-1:1;});
        amcBatchModal(entries);}});});
}

/* ---- GMC ---- */
function parseGmc(rows){
  var hi=findHeader(rows,["client"]);
  if(hi<0)hi=findHeader(rows,["gmc"]);
  if(hi<0)return null;
  var H=rows[hi];
  var cNo=pickCol(H,["OSF / GMC No.","GMC No","OSF No","GMC","Job No"]),
      cCl=pickCol(H,["Client Name","Client","Customer"]),
      cD=pickCol(H,["Job Description","Description","Job"]),
      cS=pickCol(H,["Detailed Scope (from Quotation)","Detailed Scope","Scope"]),
      cJ=pickCol(H,["JCC No.","JCC No","JCC"]),
      cJD=pickCol(H,["JCC Date"]),
      cSt=pickCol(H,["Status"]),
      cR=pickCol(H,["Remarks"]);
  if(cNo<0)return null;
  var out=[];
  for(var i=hi+1;i<rows.length;i++){
    var r=rows[i],no=String(r[cNo]||"").trim();
    if(!no||!/\d/.test(no))continue;
    var st=String(cSt>-1?r[cSt]:"").trim().toUpperCase();
    out.push({gmcNo:gmcNorm(no),
      clientRaw:cCl>-1?String(r[cCl]||"").trim():"",
      desc:cD>-1?String(r[cD]||"").trim():"",
      scope:cS>-1?String(r[cS]||"").trim():"",
      jccNo:cJ>-1?String(r[cJ]||"").trim():"",
      jccDate:cJD>-1?xlDate(r[cJD]):"",
      status:st.indexOf("COMPLET")>-1?"Completed":(st.indexOf("BALANCE")>-1?"Balance Work":(st.indexOf("HOLD")>-1?"On Hold":"Ongoing")),
      remarks:cR>-1?String(r[cR]||"").trim():""});}
  return out.length?out:null;}

function importGmcRecords(recs,srcMonth){
  var seen={},isNew=[],upd=[];
  recs.forEach(function(r){
    r.gmcNo=gmcNorm(r.gmcNo);
    if(seen[r.gmcNo])return; seen[r.gmcNo]=1;
    var ex=null;state.gmc.forEach(function(g){if(sameGmc(g.gmcNo,r.gmcNo))ex=g;});
    if(ex)upd.push({ex:ex,rec:r});else isNew.push(r);});
  if(!isNew.length&&!upd.length)return toast("No GMC rows found.");
  var body='<div class="info"><b>'+isNew.length+'</b> new GMC number(s) found, <b>'+upd.length
    +'</b> existing job(s) will be refreshed with the latest JCC, status and remarks.</div>';
  if(isNew.length){
    body+='<p class="hint">New numbers:</p><div class="tbl-wrap" style="max-height:250px;overflow-y:auto"><table><thead><tr>'
      +'<th>GMC no</th><th>Client</th><th>Job</th><th>Status</th></tr></thead><tbody>'
      +isNew.map(function(r){return '<tr><td class="num site-name">'+esc(r.gmcNo)+'</td><td>'+esc(r.clientRaw)
        +'</td><td>'+esc(r.desc)+'</td><td>'+esc(r.status)+'</td></tr>';}).join("")+'</tbody></table></div>';
  }else body+='<p class="hint">Every number in that list is already in the register.</p>';
  openModal("Import GMC list",body,function(){
    isNew.forEach(function(r){
      state.gmc.push({id:uid(),month:(r.jccDate?r.jccDate.slice(0,7):(srcMonth||state.curMonth)),
        gmcNo:r.gmcNo,clientRaw:r.clientRaw,client:r.clientRaw,desc:r.desc,scope:r.scope,
        jccNo:r.jccNo,jccDate:r.jccDate,status:r.status,
        report:r.status==="Completed"?"Signed / JCC received":"Not submitted",
        qtn:r.status==="Completed"?"Approved":"Sent",schedDate:"",
        doneDate:r.status==="Completed"?r.jccDate:"",techs:[],remarks:r.remarks,location:"Dammam"});});
    upd.forEach(function(u){
      u.ex.status=u.rec.status;
      if(u.rec.jccNo)u.ex.jccNo=u.rec.jccNo;
      if(u.rec.jccDate){u.ex.jccDate=u.rec.jccDate;u.ex.month=u.rec.jccDate.slice(0,7);}
      if(u.rec.remarks)u.ex.remarks=u.rec.remarks;
      if(u.rec.scope)u.ex.scope=u.rec.scope;
      if(u.rec.status==="Completed"){u.ex.report="Signed / JCC received";
        if(!u.ex.doneDate&&u.rec.jccDate)u.ex.doneDate=u.rec.jccDate;}});
    closeModal();commit(isNew.length+" new GMC added, "+upd.length+" updated");
  },"",true);}

function importGmcFiles(files){
  var all=[],left=files.length,srcMonth="";
  if(!left)return;
  Array.prototype.forEach.call(files,function(f){
    readWorkbook(f,function(sheets){
      sheets.forEach(function(s){
        var recs=parseGmc(s.rows);
        if(recs){all=all.concat(recs);srcMonth=detectMonth(s.sheet)||detectMonth(f.name)||srcMonth;}});
      if(--left===0){
        if(!all.length)return toast("No GMC table found in those files.");
        importGmcRecords(all,srcMonth);}});});
}

/* ================= export ================= */
function sheetFrom(rows){return XLSX.utils.aoa_to_sheet(rows);}
function saveBook(sheets,name){
  var wb=XLSX.utils.book_new();
  sheets.forEach(function(s){XLSX.utils.book_append_sheet(wb,sheetFrom(s.rows),s.name.slice(0,31));});
  XLSX.writeFile(wb,name);toast("Saved "+name);}
function amcRows(m){
  var r=[["S.No","AMC No","Site","System","Service No","SR No","Service Date","Status","Completed on","Service Report","QTN to client","Technicians","Contract","Notes"]];
  amcOf(m).forEach(function(a,i){r.push([i+1,a.amcNo,a.site,a.system,a.serviceNo,a.srNo||"",fmt(a.schedDate),a.status,
    fmt(a.doneDate),a.report,a.qtn,techNames(a.techs)||a.techText||"",a.contractStatus,a.notes]);});
  return r;}
function gmcRows(list){
  var r=[["S.No","GMC No","Client","Job Description","Detailed Scope","Month","Scheduled","Status","Completed on","Service Report","QTN to client","JCC No","JCC Date","Technicians","Remarks"]];
  list.forEach(function(g,i){r.push([i+1,g.gmcNo,g.clientRaw,g.desc,g.scope,mLabel(g.month),fmt(g.schedDate),
    g.status,fmt(g.doneDate),g.report,g.qtn,g.jccNo,fmt(g.jccDate),techNames(g.techs),g.remarks]);});
  return r;}
function callRows(list){
  var r=[["S.No","Date","Time received","Caller","Contact","Client / Site","Location","Issue reported","Attended by","Attended at","Status","GMC No","Remarks"]];
  list.forEach(function(o,i){r.push([i+1,fmt(o.date),o.time,o.caller,o.phone,o.client,o.location,o.issue,
    techNames(o.techIds),o.attendedAt,o.status,o.gmcNo,o.remarks]);});
  return r;}
function dutyRows(){
  var r=[["Date","Site / Job","Activity","Manpower","Technicians","Location","Remarks"]];
  state.duties.slice().sort(function(a,b){return a.date<b.date?-1:1;}).forEach(function(d){
    r.push([fmt(d.date),d.siteText,d.activity,(d.techIds||[]).length,techNames(d.techIds),d.location,d.remarks]);});
  return r;}
function exportIt(k){
  var m=state.curMonth,tag=mLabel(m).replace(" ","-");
  if(k==="amc")saveBook([{name:"AMC "+tag,rows:amcRows(m)}],"GSSC-AMC-"+tag+".xlsx");
  else if(k==="gmc")saveBook([{name:"GMC",rows:gmcRows(state.gmc)}],"GSSC-GMC-jobs.xlsx");
  else if(k==="oncall")saveBook([{name:"On-Call "+tag,rows:callRows(callsOf(m))}],"GSSC-oncall-"+tag+".xlsx");
  else if(k==="duty")saveBook([{name:"Duty",rows:dutyRows()}],"GSSC-duty-schedule.xlsx");
  else if(k==="report"){
    var A=amcOf(m),G=gmcOf(m);
    function pick(a,f){return f(a);}
    saveBook([
      {name:"Summary",rows:[["GSSC month-end summary",mLabel(m)],[],["Category","Count"],
        ["AMC total",A.length],["AMC completed",A.filter(function(x){return done(x.status);}).length],
        ["AMC ongoing",A.filter(function(x){return x.status==="Ongoing"||x.status==="Report Pending Sign";}).length],
        ["AMC pending",A.filter(function(x){return x.status==="Open"||x.status==="Postponed";}).length],
        ["AMC on hold",A.filter(function(x){return x.status==="On Hold"||x.contractStatus==="On Hold";}).length],
        ["AMC under renewal",A.filter(function(x){return x.status==="Under Renewal"||x.contractStatus==="Under Renewal";}).length],
        ["AMC cancelled",A.filter(function(x){return x.status==="Cancelled";}).length],
        ["AMC report not signed",A.filter(function(x){return x.status==="Report Pending Sign"||(done(x.status)&&x.report!=="Signed / JCC received");}).length],
        ["GMC total",G.length],["GMC completed",G.filter(function(x){return done(x.status);}).length],
        ["GMC ongoing / balance",G.filter(function(x){return x.status==="Ongoing"||x.status==="Balance Work";}).length],
        ["GMC pending",G.filter(function(x){return x.status==="Open";}).length],
        ["On-call received",callsOf(m).length]]},
      {name:"AMC "+tag,rows:amcRows(m)},
      {name:"GMC "+tag,rows:gmcRows(G)},
      {name:"On-Call "+tag,rows:callRows(callsOf(m))}
    ],"GSSC-month-report-"+tag+".xlsx");
  }
  else saveBook([{name:"AMC "+tag,rows:amcRows(m)},{name:"GMC",rows:gmcRows(state.gmc)},
    {name:"On-Call",rows:callRows(state.oncall)},{name:"Duty",rows:dutyRows()},
    {name:"Contracts",rows:[["AMC No","Site","System","Frequency","Manpower","Days","Man-hours","Value","Contract","Payment terms"]]
      .concat(state.contracts.map(function(c){return [c.amcNo,c.site,c.system,c.freq,c.manpower,c.days,c.manhours,c.value,c.contractStatus,c.payment];}))}
  ],"GSSC-tracker-backup.xlsx");
}

  });

      var dk=b.dataset.dopen,ix=dk.indexOf("-"),kind=dk.slice(0,ix),rid=dk.slice(ix+1);

      return;}

    if(b.id==="lkOn"){lockScreen("set");return;}
    if(b.id==="lkChange"){lockScreen("change");return;}
    if(b.id==="lkOff"){lockScreen("off");return;}
    if(b.id==="syncSet"){syncModal();return;}
    if(b.id==="upBtn"){
      ulog("Upload button pressed \u2014 opening the file picker");
      var pi=document.getElementById("photoIn");
      if(!pi){ulog("ERROR: the file input is missing from the page");return toast("Upload control missing");}
      try{pi.click();}catch(e){ulog("ERROR opening picker: "+(e.message||e));}
      return;}
    if(b.id==="calHelp"){calendarHowTo();return;}
    if(b.dataset.cal!==undefined){
      var cm=+b.dataset.cal;
      calMonth=cm===0?mKey(today()):mAdd(calMonth||state.curMonth,cm);render();return;}
    if(b.dataset.book){bookModal(b.dataset.book);return;}
    if(b.dataset.add==="book"){bookModal(iso(today()));return;}
    if(b.dataset.fshare){shareFile(b.dataset.fshare);return;}
    if(b.id==="shareMonth"){shareMonthPack();return;}
    if(b.id==="upDiag"){
      var log=UPLOG.join("\n");
      if(!log){try{log=localStorage.getItem("gssc-uplog")||"";}catch(e){}}
      var env="app v14 | "+navigator.userAgent+"\nfiles held: "+(state.files||[]).length
        +" | storage: "+(window.indexedDB?"available":"blocked")
        +" | standalone: "+((window.matchMedia&&matchMedia("(display-mode: standalone)").matches)?"yes":"no");
      openModal("What happened on the last upload",
        '<p class="hint">Copy all of this and send it to Claude \u2014 it says exactly where the upload stopped.</p>'
        +'<textarea id="dLog" style="width:100%;min-height:230px;font-family:monospace;font-size:11.5px">'
        +esc(env+"\n\n"+(log||"No upload has been tried on this device yet."))+'</textarea>',
        null,'<button class="btn ghost" id="dCopy">Copy</button>'
          +'<button class="btn ghost" id="dClear">Clear log</button>',true);
      var cl=document.getElementById("dClear");
      if(cl)cl.onclick=function(){UPLOG=[];try{localStorage.removeItem("gssc-uplog");}catch(e){}
        closeModal();toast("Log cleared \u2014 now try the upload again");};
      var cp=document.getElementById("dCopy");
      if(cp)cp.onclick=function(){
        var ta=document.getElementById("dLog");ta.select();
        try{document.execCommand("copy");toast("Copied \u2014 paste it to Claude");}catch(e){toast("Select the text and copy it");}};
      return;}
    if(b.dataset.up){
      UPFOR=b.dataset.up;
      ulog("Report button pressed on "+b.dataset.up);
      var pj=document.getElementById("photoIn");
      try{pj.click();}catch(e){ulog("ERROR opening picker: "+(e.message||e));}
      return;}
    if(b.dataset.fopen){openFile(b.dataset.fopen);return;}
    if(b.dataset.fdel){
      var ff=byId(state.files,b.dataset.fdel);if(!ff)return;
      if(!confirm("Delete "+ff.name+"? The job status stays as it is."))return;
      idbDel(ff.id);state.files=state.files.filter(function(x){return x.id!==ff.id;});
      commit("File deleted");return;}
    if(b.id==="syncGo"){syncNow(true);return;}
    if(b.dataset.print){window.print();return;}
    if(b.dataset.export){exportIt(b.dataset.export);return;}
    if(b.dataset.import){askFile(b.dataset.import);return;}
    if(b.dataset.paste){pasteModal(b.dataset.paste);return;}
    if(b.dataset.by){boardBy=b.dataset.by;render();return;}
    if(b.dataset.week!==undefined){var w=+b.dataset.week;
      weekStart=w===0?mondayOf(new Date()):addDays(weekStart,w*7);render();return;}
    if(b.dataset.client!==undefined){selClient=b.dataset.client;query="";render();return;}
    if(b.dataset.open){var p=b.dataset.open.split("|");
      if(p[0]==="amc")amcModal(byId(state.amc,p[1]));else gmcModal(byId(state.gmc,p[1]));return;}
    if(b.dataset.call){callModal(byId(state.oncall,b.dataset.call));return;}
    if(b.dataset.duty){dutyModal(byId(state.duties,b.dataset.duty));return;}
    if(b.dataset.contract){contractModal(byId(state.contracts,b.dataset.contract));return;}
    if(b.dataset.new){var q=b.dataset.new.split("|");dutyModal(null,q[0],q[1]);return;}
    if(b.dataset.add==="amc"){amcModal(null);return;}
    if(b.dataset.add==="gmc"){gmcModal(null);return;}
    if(b.dataset.add==="call"){callModal(null);return;}
    if(b.dataset.add==="quickcall"){quickCallModal();return;}
    if(b.dataset.dday){dutyDay=null;render();return;}
    if(b.dataset.dcopy){dutyCopy(dutyDayDate());return;}
    if(b.dataset.dshare){dutyShare(dutyDayDate());return;}
    if(b.dataset.dsend){var wc=SETT.waList[+b.dataset.dsend];if(wc)dutySendTo(wc.num,dutyDayDate());return;}
    if(b.dataset.dsend===""){var wc0=SETT.waList[0];if(wc0)dutySendTo(wc0.num,dutyDayDate());return;}
    if(b.dataset.waedit){waModal(+b.dataset.waedit);return;}
    if(b.dataset.waedit===""){waModal(0);return;}
    if(b.id==="waAdd"){waModal(-1);return;}
    if(b.id==="logClear"){state.log=[];save();render();toast("List cleared");return;}
    if(b.id==="dupChk"){dupModal();return;}
    if(b.id==="scriptChk"){scriptCheck();return;}
    if(b.id==="chatGo"){
      var q=(document.getElementById("chatIn")||{}).value||"";
      if(q.trim())agentAsk(q.trim());return;}
    if(b.id==="chatClr"){CHAT=[];chatSave();render();return;}
    if(b.id==="readRep"){document.getElementById("agentIn").click();return;}
    if(b.dataset.delmonth){monthDeleteModal();return;}
    if(b.dataset.gsheet){gsModal(b.dataset.gsheet);return;}
    if(b.dataset.add==="duty"){dutyModal(null,iso(today()));return;}
    if(b.dataset.add==="tech"){techModal(null);return;}
    if(b.dataset.bulk){bulkDateModal();return;}
    if(b.dataset.tech){techModal(byId(state.techs,b.dataset.tech));return;}
    if(b.dataset.techdel){var tc=byId(state.techs,b.dataset.techdel);if(!tc)return;
      if(!confirm("Remove "+tc.name+"?"))return;
      state.techs=state.techs.filter(function(x){return x.id!==tc.id;});commit("Removed");return;}
    if(b.dataset.reset){
      if(!confirm("Reset everything to the uploaded August lists? All statuses, dates, calls and duties will be cleared."))return;
      state=JSON.parse(JSON.stringify(SEED));commit("Reset");return;}
  });
}
function filt(tbl,qi,si,mi){
  var q=(document.getElementById(qi)||{value:""}).value.toLowerCase();
  var s=(document.getElementById(si)||{value:""}).value;
  var mm=mi?(document.getElementById(mi)||{value:""}).value:"";
  Array.prototype.forEach.call(document.querySelectorAll("#"+tbl+" tbody tr"),function(tr){
    if(!tr.dataset.row)return;
    tr.style.display=(tr.dataset.row.indexOf(q)>-1&&(!s||tr.dataset.stat===s)&&(!mm||tr.dataset.month===mm))?"":"none";});
}
var importKind="amc";
function askFile(kind){importKind=kind;document.getElementById("fileIn").click();}
document.getElementById("fileIn").addEventListener("change",function(){
  var picked=Array.prototype.slice.call(this.files||[]);
  this.value="";
  if(!picked.length)return;
  if(importKind==="amc")importAmcFiles(picked);
  else if(importKind==="call")importCallFiles(picked);
  else importGmcFiles(picked);
});
document.getElementById("photoIn").addEventListener("change",function(){
  var picked=Array.prototype.slice.call(this.files||[]);
  ulog("picker closed \u2014 returned "+picked.length+" file(s)");
  this.value="";
  if(picked.length){closeModal();uploadPicked(picked);}
  else toast("No file was chosen");
});
document.addEventListener("keydown",function(e){
  if(e.key!=="Enter")return;
  var t=e.target;
  if(!t||t.id!=="chatIn")return;
  e.preventDefault();
  var q=(t.value||"").trim();
  if(q)agentAsk(q);
});
document.getElementById("agentIn").addEventListener("change",function(){
  var picked=Array.prototype.slice.call(this.files||[]);
  this.value="";
  if(picked.length)agentReadFile(picked[0]);
  else toast("No picture was chosen");
});
document.getElementById("themeBtn").addEventListener("click",function(){
  var i=0;THEMES.forEach(function(x,ix){if(x[0]===SETT.theme)i=ix;});
  var nx=THEMES[(i+1)%THEMES.length];
  SETT.theme=nx[0];settSave();applyTheme();render();toast(nx[1]);});
document.querySelector("nav.tabs").addEventListener("click",function(e){
  var b=e.target.closest("button[data-tab]");if(!b)return;
  tab=b.dataset.tab;if(tab!=="search")selClient="";render();});

load();
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      reg.update();
      setInterval(function(){reg.update();},60*60*1000);
    }).catch(function(){});});
}
})();
</script>
