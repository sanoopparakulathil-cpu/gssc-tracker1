<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GSSC AMC / GMC Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F3864">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GSSC Tracker">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{--navy:#1F3864;--navy-2:#2C4A80;--teal:#2082A5;--red:#C00000;--amber:#B26A00;
    --green:#1E7A54;--ink:#1A1D23;--muted:#5F6B7C;--line:#D9DEE7;--line-soft:#EBEEF4;
    --paper:#F4F6FA;--card:#FFFFFF;--head:#1F3864;--headink:#FFFFFF;--headsub:#B9C6DE;
    --rowhover:#F7F9FC;--thbg:#FAFBFD;--soft:#F7F9FC;--wknd:#FCE9E9;--wkdy:#EDF6ED}
  html[data-theme="dark"]{--navy:#8FB3E8;--navy-2:#A9C6F0;--teal:#4FB6D8;--red:#FF8A8A;--amber:#F0B429;
    --green:#5FD3A0;--ink:#E8ECF3;--muted:#9AA7BC;--line:#2C3444;--line-soft:#242B38;
    --paper:#12161F;--card:#1A2029;--head:#0E1218;--headink:#E8ECF3;--headsub:#8FA3C6;
    --rowhover:#212936;--thbg:#161C26;--soft:#212936;--wknd:#2A1A1A;--wkdy:#16241A}
  html[data-theme="night"]{--navy:#C7D2E8;--navy-2:#DDE5F5;--teal:#7FD4E8;--red:#FF9A9A;--amber:#FFC857;
    --green:#7FE0B4;--ink:#F2F4F8;--muted:#A8B2C4;--line:#333333;--line-soft:#242424;
    --paper:#000000;--card:#141414;--head:#000000;--headink:#F2F4F8;--headsub:#9AA7BC;
    --rowhover:#1E1E1E;--thbg:#111111;--soft:#1A1A1A;--wknd:#241010;--wkdy:#101E14}
  html[data-theme="teal"]{--navy:#0E5A6B;--navy-2:#13738A;--teal:#0E7C8C;--head:#0E5A6B;--paper:#F1F7F8;--card:#FFFFFF}
  html[data-theme="graphite"]{--navy:#33383F;--navy-2:#454B54;--teal:#5C7A8A;--head:#2B3037;--paper:#F5F6F7;--card:#FFFFFF}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:Calibri,"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--paper);
    color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}
  header.top{background:var(--head);color:var(--headink);padding:10px 16px;display:flex;align-items:center;gap:13px;flex-wrap:wrap;border-bottom:3px solid var(--red)}
  .mark{height:36px;width:auto;display:block;background:#fff;padding:3px 5px;border-radius:3px;flex:0 0 auto}
  .title-wrap h1{font-size:15px;margin:0;font-weight:600}
  .title-wrap span{font-size:11px;color:var(--headsub);letter-spacing:.06em;text-transform:uppercase}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:11px;font-size:12.5px;color:var(--headsub)}
  .dot{width:7px;height:7px;border-radius:50%;background:#54D08A;display:inline-block;margin-right:5px}
  .dot.warn{background:#F0B429}
  nav.tabs{background:var(--card);border-bottom:1px solid var(--line);display:flex;overflow-x:auto;position:sticky;top:0;z-index:20}
  nav.tabs button{appearance:none;background:none;border:none;font-family:inherit;font-size:14.5px;font-weight:800;
    letter-spacing:.04em;text-transform:uppercase;color:var(--tabc,var(--muted));padding:13px 16px;cursor:pointer;
    white-space:nowrap;border-bottom:4px solid transparent;opacity:.62}
  nav.tabs button:hover{opacity:1;background:var(--line-soft)}
  nav.tabs button[aria-selected="true"]{opacity:1;color:#fff;background:var(--tabc,var(--navy));
    border-bottom-color:var(--tabc,var(--teal))}
  nav.tabs button::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;
    display:inline-block;margin-right:7px;vertical-align:1px;opacity:.8}
  nav.tabs button[aria-selected="true"]::before{opacity:1;background:#fff}
  nav.tabs button[data-tab="dash"]{--tabc:#1E5AA8}
  nav.tabs button[data-tab="search"]{--tabc:#0E8A7D}
  nav.tabs button[data-tab="amc"]{--tabc:#2E7D32}
  nav.tabs button[data-tab="gmc"]{--tabc:#6A3FB5}
  nav.tabs button[data-tab="oncall"]{--tabc:#C62828}
  nav.tabs button[data-tab="cal"]{--tabc:#E07A00}
  nav.tabs button[data-tab="files"]{--tabc:#00838F}
  nav.tabs button[data-tab="duty"]{--tabc:#AD1457}
  nav.tabs button[data-tab="agent"]{--tabc:#B25000}
  .chat{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow-y:auto;padding:2px}
  .msg{max-width:86%;padding:9px 12px;border-radius:12px;font-size:14.5px;line-height:1.5;white-space:pre-wrap}
  .msg.me{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:3px}
  .msg.ai{align-self:flex-start;background:var(--soft);border:1px solid var(--line);border-bottom-left-radius:3px}
  .msg.err{align-self:flex-start;background:#FCE9E9;border:1px solid #E9B7B7;color:#7A1F1F}
  .msg .who{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.6;margin-bottom:3px}
  nav.tabs button[data-tab="updates"]{--tabc:#8D6E00}
  nav.tabs button[data-tab="report"]{--tabc:#455A64}
  nav.tabs button[data-tab="data"]{--tabc:#6D4C41}
  nav.tabs button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
  #monthbar{background:var(--line-soft);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;
    align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
  #monthbar select{font-family:inherit;font-size:14px;font-weight:700;color:var(--navy);padding:5px 8px;border:1px solid var(--line);border-radius:3px;background:var(--card);color:var(--ink)}
  #monthbar .mstat{color:var(--muted);font-size:12.5px}
  main{padding:16px;max-width:1560px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:4px;margin-bottom:14px}
  .card>h2{margin:0;padding:10px 14px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
    color:var(--navy);border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .card>h2 .count{background:var(--line-soft);color:var(--muted);border-radius:10px;padding:1px 8px;font-size:11px;letter-spacing:.04em}
  .card>h2.tealh{color:var(--teal)}
  .card .body{padding:14px}
  .card .body.flush{padding:0}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-bottom:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:4px;padding:10px 12px}
  .stat.red{border-left-color:var(--red)}.stat.amber{border-left-color:var(--amber)}
  .stat.green{border-left-color:var(--green)}.stat.navy{border-left-color:var(--navy)}
  .stat b{display:block;font-size:26px;line-height:1.15;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
  .stat.red b{color:var(--red)}.stat.amber b{color:var(--amber)}.stat.green b{color:var(--green)}
  .stat .sub{font-size:11.5px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;
    padding:8px 9px;border-bottom:1px solid var(--line);background:var(--thbg);white-space:nowrap}
  td{padding:6px 9px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  tbody tr:hover{background:var(--rowhover)}
  td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
  .tbl-wrap{overflow-x:auto}
  .site-name{font-weight:600;color:var(--navy)}
  .sub{display:block;font-size:11.5px;color:var(--muted)}
  .pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:2px 7px;border-radius:2px;white-space:nowrap;border:1px solid transparent}
  .pill.amc{background:rgba(32,130,165,.13);color:var(--navy);border-color:#C7DAEC}
  .pill.gmc{background:rgba(32,130,165,.16);color:#12657F;border-color:#BFDFE8}
  .pill.ok{background:rgba(30,122,84,.15);color:var(--green);border-color:#C6E5D5}
  .pill.due{background:rgba(178,106,0,.16);color:var(--amber);border-color:#F0DCB4}
  .pill.over{background:rgba(192,0,0,.13);color:var(--red);border-color:#F1C9C9}
  .pill.hold{background:var(--line-soft);color:var(--muted);border-color:#DCE1EA}
  /* strong row flags so a problem line is impossible to miss */
  tr.f-over>td{background:#FBDDDD!important;box-shadow:inset 4px 0 0 #C00000}
  tr.f-over>td:first-child{font-weight:800;color:#8E0000}
  tr.f-open>td{background:#FFF3D6!important;box-shadow:inset 4px 0 0 #B26A00}
  tr.f-renew>td{background:#E4E0F7!important;box-shadow:inset 4px 0 0 #5B3FA8}
  tr.f-hold>td{background:#E2E6EC!important;box-shadow:inset 4px 0 0 #6B7686}
  tr.f-done>td{box-shadow:inset 4px 0 0 #1E7A54}
  .flag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
    padding:2px 7px;border-radius:9px;margin-left:6px;color:#fff;vertical-align:1px}
  .flag.over{background:#C00000}
  .flag.open{background:#B26A00}
  .flag.renew{background:#5B3FA8}
  .flag.hold{background:#6B7686}
  .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);padding:9px 2px 0}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{width:16px;height:12px;border-radius:3px;display:inline-block}
  button.btn{font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:4px;cursor:pointer;
    border:1px solid var(--navy);background:var(--navy);color:#fff}
  button.btn:hover{background:var(--navy-2)}
  button.btn.ghost{background:var(--card);color:var(--navy);border-color:var(--line)}
  button.btn.ghost:hover{background:var(--line-soft)}
  button.btn.danger{background:var(--card);color:var(--red);border-color:#EBC3C3}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .toolbar .spacer{margin-left:auto}
  .link{background:none;border:none;font-family:inherit;font-size:12.5px;color:var(--teal);cursor:pointer;padding:2px 4px;font-weight:600}
  .link:hover{text-decoration:underline}
  .link.del{color:var(--red)}
  select.inline,input.inline{font-family:inherit;font-size:12.5px;padding:3px 5px;border:1px solid var(--line);
    border-radius:3px;background:var(--card);color:var(--ink);max-width:155px}
  select.inline.s-Completed{background:rgba(30,122,84,.15);color:var(--green);font-weight:700;border-color:#C6E5D5}
  select.inline.s-Ongoing{background:rgba(178,106,0,.16);color:var(--amber);font-weight:700;border-color:#F0DCB4}
  select.inline.s-Open{background:rgba(32,130,165,.13);color:var(--navy-2);font-weight:700;border-color:#C7DAEC}
  select.inline.s-Hold{background:var(--line-soft);color:var(--muted);font-weight:700}
  select.inline.r-yes{background:rgba(30,122,84,.15);color:var(--green);font-weight:700;border-color:#C6E5D5}
  select.inline.r-no{background:rgba(192,0,0,.13);color:var(--red);font-weight:700;border-color:#F1C9C9}
  select.inline.r-mid{background:rgba(178,106,0,.16);color:var(--amber);font-weight:700;border-color:#F0DCB4}
  input.inline[type=date]{width:132px}
  input.inline.late{border-color:#E7A9A9;background:rgba(192,0,0,.13);color:var(--red);font-weight:700}
  input[type=search],select.filter{font-family:inherit;font-size:13.5px;padding:7px 10px;border:1px solid var(--line);border-radius:3px;background:var(--card);color:var(--ink)}
  input#q{min-width:290px;font-size:15px;border:2px solid var(--navy);border-radius:3px;padding:9px 12px}
  .empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:13.5px}
  .empty b{display:block;color:var(--navy);font-size:14.5px;margin-bottom:3px}
  .clients{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:10px}
  .cbtn{text-align:left;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--teal);
    border-radius:4px;padding:10px 12px;cursor:pointer;font-family:inherit;width:100%}
  .cbtn:hover{border-color:var(--teal);background:#F5FAFC}
  .cbtn strong{display:block;color:var(--navy);font-size:14px;margin-bottom:3px}
  .cbtn em{font-style:normal;font-size:11.5px;color:var(--muted);display:block}
  .cbtn .bar{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:7px;background:var(--line-soft)}
  .cbtn .bar i{display:block;height:100%;background:var(--green)}
  .board-wrap{overflow-x:auto}
  table.board{border-collapse:separate;border-spacing:0;min-width:940px}
  table.board th.rowh,table.board td.rowc{position:sticky;left:0;background:var(--thbg);z-index:2;border-right:1px solid var(--line);min-width:158px}
  table.board td.rowc{font-weight:600;color:var(--navy);font-size:13px}
  table.board th.day{text-align:center;min-width:126px;padding:6px}
  table.board th.day.today{background:#E7F0F8;color:var(--navy)}
  table.board th.day em{display:block;font-style:normal;font-size:15px;color:var(--ink);font-weight:700;letter-spacing:0}
  table.board td{border-bottom:1px solid var(--line-soft);padding:3px;vertical-align:top}
  .chip{display:block;width:100%;text-align:left;font-family:inherit;border:1px solid var(--line);border-left:3px solid var(--teal);
    background:var(--card);border-radius:3px;padding:4px 6px;margin-bottom:3px;cursor:pointer;font-size:11px;color:var(--muted)}
  .chip:hover{border-color:var(--teal);background:#F5FAFC}
  .chip strong{display:block;font-size:12px;color:var(--navy);font-weight:600;line-height:1.25}
  .chip.AMC{border-left-color:var(--navy)}.chip.GMC{border-left-color:var(--teal)}
  .chip.On-Call{border-left-color:var(--red)}.chip.Site-Survey{border-left-color:var(--amber)}
  .chip.Leave,.chip.Office{border-left-color:#9AA5B5;background:#F7F8FA}
  .addcell{width:100%;border:1px dashed var(--line);background:none;border-radius:3px;color:var(--teal);
    font-size:15px;line-height:1.6;cursor:pointer;opacity:.35;font-family:inherit}
  td:hover .addcell{opacity:1}
  .addcell:hover{border-color:var(--teal);background:#F5FAFC}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);padding:10px 14px;border-top:1px solid var(--line-soft)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .scrim{position:fixed;inset:0;background:rgba(20,28,45,.5);display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;z-index:100;overflow-y:auto}
  .modal{background:var(--card);border-radius:5px;width:100%;max-width:580px;box-shadow:0 18px 50px rgba(15,25,45,.3)}
  .modal h3{margin:0;padding:12px 16px;font-size:12.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--headink);background:var(--head);border-radius:5px 5px 0 0}
  .modal .m-body{padding:16px}
  .modal .m-foot{padding:12px 16px;border-top:1px solid var(--line-soft);display:flex;gap:8px;align-items:center}
  .modal .m-foot .spacer{margin-left:auto}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:4px}
  .field input,.field select,.field textarea{width:100%;font-family:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line);border-radius:3px;background:var(--card);color:var(--ink)}
  .field textarea{min-height:60px;resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  .err{background:rgba(192,0,0,.13);border:1px solid #F1C9C9;color:var(--red);font-size:12.5px;padding:8px 10px;border-radius:3px;margin-bottom:12px}
  .info{background:rgba(32,130,165,.13);border:1px solid #C7DAEC;color:var(--navy);font-size:12.5px;padding:8px 10px;border-radius:3px;margin-bottom:12px}
  .hint{font-size:11.5px;color:var(--muted);margin:2px 0 12px}
  .checks{border:1px solid var(--line);border-radius:3px;padding:6px;max-height:170px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:2px}
  .checks label{display:flex;align-items:center;gap:6px;font-size:13.5px;padding:4px 6px;border-radius:3px;cursor:pointer;
    text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);margin:0}
  .checks label:hover{background:var(--line-soft)}
  .checks input{width:auto;margin:0}
  .drop{border:2px dashed var(--line);border-radius:5px;padding:20px;text-align:center;color:var(--muted);background:var(--soft)}
  .drop b{display:block;color:var(--navy);font-size:14.5px;margin-bottom:4px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:13px;
    padding:9px 16px;border-radius:3px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90%;text-align:center}
  @media (max-width:760px){
    header.top{padding:9px 12px;gap:9px}
    .title-wrap h1{font-size:13px}.title-wrap span{font-size:10px}
    nav.tabs button{padding:11px 11px;font-size:11.5px}
    .stats{grid-template-columns:1fr 1fr;gap:8px}.stat b{font-size:21px}
    table.rsp thead{display:none}
    table.rsp,table.rsp tbody,table.rsp tr,table.rsp td{display:block;width:100%}
    table.rsp tr{border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:4px;margin:9px 10px;padding:4px 0;background:var(--card)}
    table.rsp tr:hover{background:var(--card)}
    table.rsp td{border:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 10px;white-space:normal}
    table.rsp td::before{content:attr(data-l);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;flex:0 0 37%;line-height:1.3}
    table.rsp td[data-l=""]::before{content:none}
    table.rsp td[data-l=""]{justify-content:flex-end;border-top:1px solid var(--line-soft);margin-top:3px;padding-top:7px}
    table.rsp td>*{text-align:right}
    select.inline,input.inline{max-width:none;flex:1 1 auto;font-size:14px;padding:6px}
    input.inline[type=date]{width:auto}
    .tbl-wrap{overflow-x:visible}
    .clients{grid-template-columns:1fr}
    .checks{grid-template-columns:1fr}
    input#q{min-width:100%}
    .toolbar button.btn{flex:1 1 auto}
    main{padding:11px}.grid2{grid-template-columns:1fr}.top-right{width:100%;margin-left:0}
  }
  @media print{nav.tabs,.toolbar,#monthbar,header.top .top-right,.addcell{display:none!important}
    body{background:#fff}.card{break-inside:avoid}}

function fmt(s){var d=parseISO(s);if(!d)return "\u2014";
  var m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return pad(d.getDate())+"-"+m[d.getMonth()]+"-"+d.getFullYear();}
function dayDiff(a,b){return Math.round((b-a)/86400000);}
function mKey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1);}
function mLabel(k){if(!k)return "";var p=k.split("-");return MN[+p[1]-1]+" "+p[0];}
function mIdx(k){var p=k.split("-");return (+p[0])*12+(+p[1]-1);}
function mAdd(k,n){var i=mIdx(k)+n;return Math.floor(i/12)+"-"+pad(i%12+1);}
function monthOf(dateStr){return dateStr?dateStr.slice(0,7):"";}

/* ---------- util ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function uid(){return Math.random().toString(36).slice(2,9);}
function el(h){var d=document.createElement("div");d.innerHTML=h.trim();return d.firstChild;}
function toast(m){var o=document.querySelector(".toast");if(o)o.remove();
  var t=el('<div class="toast">'+esc(m)+'</div>');document.body.appendChild(t);
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.remove();},2600);}
function opts(list,sel){return list.map(function(o){
  return '<option value="'+esc(o)+'"'+(o===sel?" selected":"")+">"+esc(o)+"</option>";}).join("");}
function done(s){return s==="Completed";}
function byId(a,id){for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;}
function techName(id){var t=byId(state.techs,id);return t?t.name:"";}
function tnorm(s){return String(s||"").toLowerCase().replace(/[^a-z]/g,"");}
function splitTechs(txt){
  return String(txt||"").split(/[,/&+]|\band\b/).map(function(x){return x.trim();})
    .filter(function(x){return x&&x.length>1&&!/^[\u2014\u2013-]+$/.test(x);});}
function matchTech(name){
  var n=tnorm(name);if(n.length<3)return null;
  var hit=null;
  state.techs.forEach(function(t){
    if(hit)return;var m=tnorm(t.name);
    if(m===n||(n.length>=4&&m.indexOf(n)===0)||(m.length>=4&&n.indexOf(m)===0))hit=t;});
  return hit;}
function techNames(ids){return (ids||[]).map(techName).filter(Boolean).join(", ");}
function freqMonths(f){f=(f||"").toLowerCase();
  if(f.indexOf("week")>-1||f.indexOf("month")>-1&&f.indexOf("bi")<0&&f.indexOf("3")<0)return 1;
  if(f.indexOf("bi")>-1)return 2;
  if(f.indexOf("quarter")>-1)return 3;
  if(f.indexOf("half")>-1||f.indexOf("semi")>-1)return 6;
  if(f.indexOf("year")>-1||f.indexOf("annual")>-1)return 12;
  return 3;}
function gmcNorm(no){
  no=String(no==null?"":no).trim().toUpperCase().replace(/\s+/g,"");
  if(/^\d+$/.test(no))return "P"+no;
  return no;}
function sameGmc(a,b){return gmcNorm(a)===gmcNorm(b);}
function statusFromText(s){
  s=String(s||"").toLowerCase().replace(/[^a-z ]+/g," ").replace(/\s+/g," ").trim();
  if(!s)return "";
  if(/cancel/.test(s))return "Cancelled";
  if(/renew/.test(s))return "Under Renewal";
  if(/report pending|pending sign|pending signature|sign pending/.test(s))return "Report Pending Sign";
  if(/not done|not complet|yet to|not ?started/.test(s))return "Open";
  if(/done|complet|finish|closed/.test(s))return "Completed";
  if(/on ?going|in ?progress|partial|balance/.test(s))return "Ongoing";
  if(/hold/.test(s))return "On Hold";
  if(/postpon|resched/.test(s))return "Postponed";
  if(/open|pending/.test(s))return "Open";
  return "";}
function nextServ(s){
  var m=String(s||"").match(/(\d+)/);
  if(!m)return s||"1st Serv";
  var n=(+m[1])+1,x=n%100,suf=(x>=11&&x<=13)?"th":({1:"st",2:"nd",3:"rd"}[n%10]||"th");
  return n+suf+" Serv";}

/* ---------- activity log: what changed, most recent first ---------- */
var LOGNAME={contracts:"Contract",amc:"AMC service",gmc:"GMC job",oncall:"On-call",
  duties:"Duty",techs:"Technician",files:"Document"};
function logLabel(k,r){
  if(!r)return "";
  if(k==="amc")return (r.client||"?")+(r.serviceNo?" \u2014 service "+r.serviceNo:"");
  if(k==="gmc")return (r.gmcNo?r.gmcNo+" \u2014 ":"")+(r.client||"?");
  if(k==="oncall")return (r.client||"?")+(r.date?" ("+fmt(r.date)+")":"");
  if(k==="duties")return (r.siteText||"?")+(r.date?" ("+fmt(r.date)+")":"");
  if(k==="techs")return r.name||"?";
  if(k==="files")return r.title||r.fileName||"?";
  if(k==="contracts")return (r.site||"?")+(r.amcNo?" ("+r.amcNo+")":"");
  return r.id||"";}
function logPush(list){
  if(!list.length)return;
  state.log=state.log||[];
  if(list.length>8){
    state.log.unshift({t:Date.now(),act:"bulk",k:"",label:list.length+" records added or changed"});}
  else list.forEach(function(e){state.log.unshift(e);});
  if(state.log.length>60)state.log=state.log.slice(0,60);}
function logText(e){
  var what=e.k?(LOGNAME[e.k]||e.k):"";
  if(e.act==="bulk")return e.label;
  if(e.act==="add")return what+" added \u2014 "+e.label;
  if(e.act==="del")return what+" removed \u2014 "+e.label;
  return what+" changed \u2014 "+e.label;}
function agoText(ms){
  var s=Math.floor((Date.now()-ms)/1000);
  if(s<60)return "just now";
  if(s<3600)return Math.floor(s/60)+" min ago";
  if(s<86400)return Math.floor(s/3600)+" hr ago";
  var d=Math.floor(s/86400);
  return d===1?"yesterday":d+" days ago";}

function agentReady(){return !!(SYNC.url&&SYNC.key);}

function agentPost(payload,cb){
  if(!agentReady())return cb({ok:false,error:"This device is not linked yet. Open Data \u0026 team \u2192 Link this device first."});
  payload.key=SYNC.key;
  fetch(SYNC.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(payload)})
    .then(function(r){return r.json();})
    .then(function(o){cb(o||{ok:false,error:"Empty reply from the script."});})
    .catch(function(e){cb({ok:false,error:"Could not reach your script ("+(e.message||"no connection")+")."});});}

/* Build a small, relevant slice of the records. Sending everything would be
   slow and would cost more than it needs to. */
function agentContext(q){
  var ql=String(q||"").toLowerCase();
  var STOP={"the":1,"and":1,"for":1,"was":1,"when":1,"what":1,"which":1,"last":1,"this":1,
    "that":1,"with":1,"from":1,"have":1,"has":1,"are":1,"any":1,"all":1,"show":1,"list":1,
    "site":1,"sites":1,"service":1,"services":1,"month":1,"year":1,"date":1,"dates":1,
    "done":1,"open":1,"who":1,"worked":1,"still":1,"much":1,"many":1,"give":1,"tell":1,
    "about":1,"line":1,"lines":1,"job":1,"jobs":1,"report":1,"reports":1,"work":1,"works":1,
    "pending":1,"closed":1,"complete":1,"completed":1,"status":1,"team":1,"visit":1,"visits":1};
  var words=ql.split(/[^a-z0-9]+/).filter(function(x){return x.length>=4&&!STOP[x];});
  var txt=function(a){return (String(a.site||"")+" "+String(a.client||"")+" "+String(a.amcNo||"")).toLowerCase();};
  /* a word that matches lots of different sites is too generic to be a site name */
  var keep=words.filter(function(x){
    var seen={},n=0;
    state.amc.forEach(function(a){
      if(txt(a).indexOf(x)>-1&&!seen[a.site]){seen[a.site]=1;n++;}});
    return n>0&&n<=5;});
  /* the whole site name written out in the question always wins */
  var strong=state.amc.filter(function(a){
    var s=String(a.site||"").toLowerCase(),c=String(a.client||"").toLowerCase();
    return (s.length>3&&ql.indexOf(s)>-1)||(c.length>3&&ql.indexOf(c)>-1)
      ||(a.amcNo&&ql.indexOf(String(a.amcNo).toLowerCase())>-1);});
  var named=strong.length?strong:state.amc.filter(function(a){
    var t=txt(a);
    for(var i=0;i<keep.length;i++)if(t.indexOf(keep[i])>-1)return true;
    return false;});
  var rows;
  if(named.length)rows=named;
  else{
    var ms=monthsPresent().sort().slice(-3);
    rows=state.amc.filter(function(a){return ms.indexOf(a.month)>-1;});}
  if(rows.length>140)rows=rows.slice(-140);
  var tn=function(ids){return (ids||[]).map(function(i){
    var t=byId(state.techs,i);return t?t.name:"";}).filter(Boolean).join(", ");};
  var ctx={
    today:iso(today()),
    amc:rows.map(function(a){return {month:a.month,amcNo:a.amcNo,site:a.site,system:a.system,
      service:a.serviceNo,status:a.status,sched:a.schedDate,done:a.doneDate,sr:a.srNo,
      report:a.report,techs:tn(a.techs)||a.techText,notes:a.notes};}),
    gmc:state.gmc.map(function(g){return {gmcNo:g.gmcNo,client:g.client,desc:g.desc,status:g.status,
      sched:g.schedDate,done:g.doneDate,jcc:g.jccNo,jccDate:g.jccDate,techs:tn(g.techs)};}),
    oncall:(state.oncall||[]).slice(-40).map(function(o){return {date:o.date,time:o.time,client:o.client,
      issue:o.issue,status:o.status,done:o.completedDate,techs:tn(o.techIds)};}),
    contracts:state.contracts.map(function(c){return {amcNo:c.amcNo,site:c.site,system:c.system,
      freq:c.freq,status:c.contractStatus};})};
  return JSON.stringify(ctx);}

    openModal("Script check",body,null,"",false,null,null);});}

function agentAsk(q){
  if(AGENTBUSY)return;
  CHAT.push({r:"me",t:q});chatSave();AGENTBUSY=true;render();
  agentPost({action:"ask",question:q,context:agentContext(q)},function(o){
    AGENTBUSY=false;
    CHAT.push(o.ok?{r:"ai",t:o.text||"(no answer)"}:{r:"err",t:o.error||"Something went wrong."});
    chatSave();render();});}

/* ---------- reading a photographed report ---------- */
var LASTREAD=null;
function agentReadFile(file){
  if(AGENTBUSY)return;
  AGENTBUSY=true;render();
  readImage(file,function(dataUrl,mime,dim){
    var b64=String(dataUrl).split(",")[1]||"";
    if(!b64){AGENTBUSY=false;CHAT.push({r:"err",t:"That file could not be opened as a picture."});
      chatSave();render();return;}
    agentPost({action:"read",data:b64,mime:mime||"image/jpeg"},function(o){
      AGENTBUSY=false;
      if(!o.ok){CHAT.push({r:"err",t:o.error||"Could not read that picture."});chatSave();render();return;}
      var f=o.fields||{};
      var filled=0;
      ["srNo","jccNo","date","site","amcNo","gmcNo","system","remarks"].forEach(function(k){
        if(f[k]&&String(f[k]).trim())filled++;});
      if(f.technicians&&f.technicians.length)filled++;
      if(!filled){
        var seen=f.seen?String(f.seen):"";
        CHAT.push({r:"err",t:"Nothing could be read from that picture"
          +(dim?" ("+dim+")":"")+"."
          +(seen?"\n\nWhat Claude says it can see: \u201c"+seen+"\u201d":
            "\n\nClaude did not say what it could see \u2014 if your Apps Script is not on the latest version, "
            +"redeploy it with Deploy \u203a Manage deployments \u203a New version.")
          +"\n\nWhat usually fixes it:\n"
          +"\u2022 Fill the frame with the page \u2014 no desk, no hands\n"
          +"\u2022 Hold the phone flat above it, not at an angle\n"
          +"\u2022 Good light, no shadow across the paper\n"
          +"\u2022 Tap the screen to focus before taking the photo\n"
          +"\u2022 One page at a time\n\n"
          +"If the form is handwritten and faint, type the fields in by hand instead."});
        chatSave();render();return;}
      LASTREAD=f;
      CHAT.push({r:"ai",t:"Read the report and found "+filled+" field(s). Check them before saving."});
      chatSave();render();readConfirmModal(f);});});}

function readConfirmModal(f){

  var guess=guessJob({srNo:f.srNo||"",jccNo:f.jccNo||"",amcNo:f.amcNo||"",gmcNo:f.gmcNo||"",date:f.date||""});
  var body='<div class="info">Check every line against the paper before saving. '
    +'Anything Claude could not read clearly is left blank.</div>'
    +'<div class="field"><label>Attach to which job</label><select id="rJob">'

    +'<div class="field"><label>JCC date</label><input type="date" id="rJccD" value="'+g("jccDate")+'"></div>'

    +'<div class="field"><label>Site</label><input id="rSite" value="'+g("site")+'"></div>'
    +'<div class="field"><label>System</label><input id="rSys" value="'+g("system")+'"></div>'
    +'<div class="grid2">'
    +'<div class="field"><label>Status</label><select id="rStat">'+opts(AMC_STATUS,f.status||"Completed")+'</select></div>'
    +'<div class="field"><label>Technicians as written</label><input id="rTx" value="'+esc(techs)+'"></div></div>'
    +'<div class="field"><label>Remarks</label><textarea id="rRem">'+g("remarks")+'</textarea></div>';
  openModal("What Claude read from the report",body,function(){
    var v=val("rJob");
    if(!v){closeModal();toast("Nothing changed");return;}

      if(val("rSr"))r.srNo=val("rSr");

      if(val("rSys")&&!r.system)r.system=val("rSys");

      r.status=val("rStat");
      if(val("rTx"))r.remarks=(r.remarks?r.remarks+" \u00b7 ":"")+val("rTx");}
    else{
      if(val("rDate"))r.completedDate=val("rDate");
      r.status=(val("rStat")==="Completed")?"Closed":r.status;}
    closeModal();commit("Saved to "+info.label);
  },"",false,null,null);}

        +'<td data-l="What">'+esc(logText(e))+'</td></tr>';});
    h+='</tbody></table></div>';}
  h+='<div class="toolbar" style="margin:10px 0 0"><span class="spacer"></span>'
    +'<button class="btn ghost" id="logClear">Clear the list</button></div>'
    +'<p class="hint">This list is kept on this device. It records what changed, not the old values.</p>';
  h+='</div></div>';
  return h;}

function stampChanges(){
  var now=Date.now();state.tomb=state.tomb||{};
  var evts=[],known=SNAP&&Object.keys(SNAP).length>0;
  COLL.forEach(function(k){
    var prev=SNAP[k]||{},seen={},byId={};
    (state[k]||[]).forEach(function(r){byId[r.id]=r;});
    (state[k]||[]).forEach(function(r){
      if(!r.id)r.id=uid();
      seen[r.id]=1;var j=noMod(r);
      if(prev[r.id]!==j){
        if(known)evts.push({t:now,k:k,act:(prev[r.id]===undefined?"add":"edit"),label:logLabel(k,r)});
        r.mod=now;delete state.tomb[k+":"+r.id];}
      else if(!r.mod)r.mod=now;});
    for(var id in prev)if(!seen[id]){
      if(known)evts.push({t:now,k:k,act:"del",label:LASTSEEN[k+":"+id]||""});
      state.tomb[k+":"+id]=now;}});
  logPush(evts);
  var cut=Date.now()-90*864e5;
  for(var t in state.tomb)if(state.tomb[t]<cut)delete state.tomb[t];
  state.updatedAt=now;snapshot();}
function mergeRemote(rem){
  if(!rem||typeof rem!=="object")return 0;
  var changed=0;
  var tomb=state.tomb||{};
  for(var t in (rem.tomb||{}))if(!tomb[t]||rem.tomb[t]>tomb[t])tomb[t]=rem.tomb[t];
  state.tomb=tomb;
  COLL.forEach(function(k){
    var map={};(state[k]||[]).forEach(function(r){map[r.id]=r;});
    (rem[k]||[]).forEach(function(r){
      if(!r||!r.id)return;
      var l=map[r.id];
      if(!l){map[r.id]=r;changed++;}
      else if((r.mod||0)>(l.mod||0)){map[r.id]=r;changed++;}});
    var out=[];
    for(var id in map){
      var r=map[id],dead=tomb[k+":"+id];
      if(dead&&dead>=(r.mod||0)){changed++;continue;}
      out.push(r);}
    state[k]=out;});
  return changed;}
function syncStatusText(){
  if(!SYNC.url)return "Not linked \u2014 this device only";
  if(SYNC.busy)return "Syncing\u2026";
  if(SYNC.err)return "Last try failed: "+SYNC.err;
  return SYNC.last?("Last synced "+new Date(SYNC.last).toLocaleString()):"Linked, not synced yet";}
function paintSync(){
  var el=document.getElementById("syncState");if(el)el.textContent=syncStatusText();
  var b=document.getElementById("saveState");
  if(b&&SYNC.url)b.innerHTML='<span class="dot'+(SYNC.busy||SYNC.err?" warn":"")+'"></span>'
    +(SYNC.busy?"Syncing":(SYNC.err?"Sync failed":"Synced"));}
function syncNow(loud){
  if(!SYNC.url||SYNC.busy)return Promise.resolve(false);
  SYNC.busy=true;SYNC.err="";paintSync();
  var u=SYNC.url+(SYNC.url.indexOf("?")>-1?"&":"?")+"key="+encodeURIComponent(SYNC.key)+"&t="+Date.now();
  return fetch(u,{method:"GET"}).then(function(r){return r.json();}).then(function(res){
    if(!res||!res.ok)throw new Error(res&&res.error?res.error:"server said no");
    var n=res.data?mergeRemote(res.data):0;
    stampChanges();
    return fetch(SYNC.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({key:SYNC.key,data:pack()})}).then(function(r2){return r2.json();}).then(function(res2){
        if(!res2||!res2.ok)throw new Error(res2&&res2.error?res2.error:"could not save");
        SYNC.busy=false;SYNC.last=Date.now();SYNC.err="";syncCfgSave();save();techFetch(false);
        if(n){render();toast(n+" change(s) came in from your other device");}
        else{paintSync();if(loud)toast("Everything is up to date");}
        return true;});
  }).catch(function(e){
    SYNC.busy=false;SYNC.err=e.message||"no connection";paintSync();
    if(loud)toast("Sync failed: "+SYNC.err);
    return false;});}
function pack(){
  var o={updatedAt:state.updatedAt||Date.now(),tomb:state.tomb||{}};
  COLL.forEach(function(k){o[k]=(k==="files")?(state[k]||[]).map(slim):(state[k]||[]);});
  return o;}
function scheduleSync(){

/* a technician finishing a job updates the matching AMC / GMC row in your list, once per update */
function techApply(){
  var seen=techApplied(),set={};seen.forEach(function(i){set[i]=1;});
  var changed=0,fresh=[];
  TECHD.events.slice().sort(function(a,b){return a.ts-b.ts;}).forEach(function(e){
    if((e.kind!=="job"&&e.kind!=="row")||set[e.id])return;
    fresh.push(e.id);
    var kind,rid;
    if(e.kind==="row"){kind=e.rowKind;rid=e.rowId;}
    else{var p=String(e.ref||"").split("|");if(p.length<2)return;kind=p[0];rid=p[1];}
    var r=kind==="amc"?byId(state.amc,rid):(kind==="gmc"?byId(state.gmc,rid):null);
    if(!r)return;
    var day=e.doneDate||iso(new Date(e.ts));
    if(e.act==="start"){
      if(r.status==="Open"){r.status="Ongoing";changed++;}
    }else if(e.act==="complete"){
      if(r.status!=="Completed"){r.status="Completed";changed++;}
      if(!r.doneDate){r.doneDate=day;changed++;}
      if(!r.doneBy&&e.tech){r.doneBy=e.tech;changed++;}
      if(!r.jccNo&&e.jcc){r.jccNo=e.jcc;changed++;}
      if(kind==="gmc"){if(!r.jccDate&&e.jcc){r.jccDate=day;changed++;}}
      else if(!r.srNo&&e.sr){r.srNo=e.sr;changed++;}
      if(e.remarks){var fld=kind==="gmc"?"remarks":"notes";
        if(String(r[fld]||"").indexOf(e.remarks)<0){r[fld]=(r[fld]?r[fld]+"\n":"")+e.tech+": "+e.remarks;changed++;}}
    }});
  if(fresh.length)techAppliedSave(seen.concat(fresh));
  if(changed){commit(changed+" update(s) from technicians applied");}
  return changed;}

function techJobState(dutyId,techId){
  var st="Pending",jcc="",sr="",last=0,items=null;
  TECHD.events.forEach(function(e){

    if(e.act==="start"&&st==="Pending")st="In Progress";
    if(e.act==="complete"){st="Completed";jcc=e.jcc||"";sr=e.sr||"";items=e.items||null;}});
  return {st:st,jcc:jcc,sr:sr,last:last,items:items};}

function hashPass(p){
  var salt="gssc-tracker-2026";
  if(window.crypto&&crypto.subtle&&window.TextEncoder){
    return crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+p)).then(function(b){
      return Array.prototype.map.call(new Uint8Array(b),function(x){
        return ("0"+x.toString(16)).slice(-2);}).join("");});}
  var h=0,s=salt+p;
  for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}
  return Promise.resolve("f"+(h>>>0).toString(16));}

    +'<button id="lkGo" style="width:100%;font-family:inherit;font-size:15px;font-weight:600;padding:11px;'
    +'border-radius:4px;border:0;background:#fff;color:#1F3864;cursor:pointer;margin-top:4px">'
    +(mode==="open"?"Unlock":(mode==="off"?"Remove":"Save"))+'</button>'
    +(mode==="open"?'<div style="font-size:12px;color:#8FA3C6;margin-top:16px;line-height:1.5">'
      +'Forgot it? Clear this app\u2019s data in your browser settings \u2014 that removes the passcode '
      +'and the data on this device with it.</div>'
      :'<button id="lkX" style="width:100%;font-family:inherit;font-size:14px;padding:10px;border-radius:4px;'
      +'border:1px solid #4A6394;background:none;color:#C6D2E6;cursor:pointer;margin-top:9px">Cancel</button>')
    +'</div>';
  document.body.appendChild(scrim);
  var err=function(m){scrim.querySelector("#lkErr").textContent=m;};
  var first=scrim.querySelector("input");if(first)first.focus();
  var close=function(){scrim.remove();};
  var x=scrim.querySelector("#lkX");if(x)x.onclick=close;
  var go=function(){
    var a=(scrim.querySelector("#lkA")||{}).value||"";
    var b=(scrim.querySelector("#lkB")||{}).value||"";
    var o=(scrim.querySelector("#lkOld")||{}).value||"";
    if(mode==="open"){
      if(!a)return err("Enter your passcode");
      hashPass(a).then(function(h){
        if(h!==LOCK.hash)return err("That is not the right passcode");
        LOCK.at=Date.now();close();});
      return;}
    if(mode==="change"||mode==="off"){
      if(!o)return err("Enter the current passcode");
      return hashPass(o).then(function(h){
        if(h!==LOCK.hash)return err("Current passcode is wrong");
        if(mode==="off"){LOCK.on=false;LOCK.hash="";lockSave();close();render();toast("Passcode removed");return;}
        finish(a,b);});}
    finish(a,b);
    function finish(a,b){
      if(a.length<4)return err("Use at least 4 characters");
      if(a!==b)return err("The two entries do not match");
      hashPass(a).then(function(h){
        LOCK.on=true;LOCK.hash=h;LOCK.at=Date.now();lockSave();close();render();
        toast("Passcode set \u2014 you will be asked for it when the app opens");});}};
  scrim.querySelector("#lkGo").onclick=go;
  scrim.addEventListener("keydown",function(e){if(e.key==="Enter")go();});}

function lockCheck(){
  if(!LOCK.on||!LOCK.hash)return;
  if(document.getElementById("lockPane"))return;
  lockScreen("open");}
function lockArm(){
  if(!LOCK.on)return;
  LOCK.at=Date.now();}
function lockMaybe(){
  if(!LOCK.on||!LOCK.hash)return;
  var mins=LOCK.mins;
  if(mins>0&&Date.now()-LOCK.at<mins*60000)return;
  lockCheck();}

/* ---------- storage ---------- */
function setSaveState(t,w){document.getElementById("saveState").innerHTML='<span class="dot'+(w?" warn":"")+'"></span>'+t;}
var STORE=(function(){
  if(window.storage&&window.storage.get&&window.storage.set)return window.storage;
  try{localStorage.setItem("__t","1");localStorage.removeItem("__t");
    return {get:function(k){return Promise.resolve({value:localStorage.getItem(k)});},
            set:function(k,v){localStorage.setItem(k,v);return Promise.resolve({value:v});}};
  }catch(e){var mem={};return {get:function(k){return Promise.resolve({value:mem[k]||null});},
            set:function(k,v){mem[k]=v;return Promise.resolve({value:v});}};}
})();
function load(){
  STORE.get(KEY).then(function(r){
    try{state=r&&r.value?JSON.parse(r.value):null;}catch(e){state=null;}
    if(!state||!state.amc||!state.contracts)state=JSON.parse(JSON.stringify(SEED));
    if(!state.oncall)state.oncall=[];
    if(!state.files)state.files=[];
    if(!state.log)state.log=[];
    chatLoad();
    boot();
  }).catch(function(){state=JSON.parse(JSON.stringify(SEED));boot();});
}
function boot(){
  lockLoad();settLoad();
  weekStart=mondayOf(new Date());
  state.tomb=state.tomb||{};
  snapshot();render();
  lockCheck();
  document.addEventListener("visibilitychange",function(){
    if(document.hidden)lockArm();else lockMaybe();});
  window.addEventListener("blur",lockArm);
  syncCfgLoad();
  if(SYNC.url){syncNow(false);
    setInterval(function(){if(!document.hidden)syncNow(false);},60000);
    window.addEventListener("focus",function(){syncNow(false);});
    document.addEventListener("visibilitychange",function(){if(!document.hidden)syncNow(false);});}}
function save(){setSaveState("Saving\u2026",true);
  var lean={};for(var sk in state)lean[sk]=(sk==="files")?(state[sk]||[]).map(slim):state[sk];
  STORE.set(KEY,JSON.stringify(lean)).then(function(){setSaveState("Saved",false);})
   .catch(function(){setSaveState("Not saved",true);});}
function commit(msg){stampChanges();save();scheduleSync();render();if(msg)toast(msg);}

/* ---------- month scoping ---------- */
function monthsPresent(){
  var s={};
  state.amc.forEach(function(a){s[a.month]=1;});
  state.gmc.forEach(function(g){if(g.month)s[g.month]=1;});
  state.oncall.forEach(function(o){if(o.date)s[monthOf(o.date)]=1;});
  s[state.curMonth]=1;
  return Object.keys(s).sort();
}
function amcOf(m){return state.amc.filter(function(a){return a.month===m;});}
function gmcOf(m){return state.gmc.filter(function(g){return g.month===m;});}
function callsOf(m){return state.oncall.filter(function(o){return monthOf(o.date)===m;});}

/* ================= dashboard ================= */
function viewDash(){
  var m=state.curMonth,t=iso(today());
  var A=amcOf(m),G=gmcOf(m),C=callsOf(m);

  var aDone=A.filter(function(x){return done(x.status);}).length;
  var gDone=G.filter(function(x){return done(x.status);}).length;
  var overdue=all.filter(function(x){return x.schedDate&&x.schedDate<t&&!done(x.status)&&x.status!=="On Hold";});
  var soon=all.filter(function(x){return x.schedDate&&x.schedDate>=t&&x.schedDate<=iso(addDays(today(),7))&&!done(x.status);});
  var repPending=all.filter(function(x){return done(x.status)&&x.report==="Not submitted";});
  var qtnPending=all.filter(function(x){return (x.qtn||"")==="To be sent";});
  var unsched=all.filter(function(x){return !x.schedDate&&!done(x.status)&&x.status!=="On Hold";});
  var openCalls=C.filter(function(c){return c.status!=="Closed";});

  var h='<div class="stats">'
    +stat("navy","AMC services",aDone+" / "+A.length,mLabel(m)+" completed")
    +stat("navy","GMC jobs",gDone+" / "+G.length,"completed")

    +stat("amber","Due in 7 days",soon.length,"plan manpower")
    +stat("amber","Reports pending",repPending.length,"done, not submitted")
    +stat("amber","QTN to send",qtnPending.length,"quotation pending")
    +stat("",'Not scheduled',unsched.length,"no date set")

    +'</div>';

      +'<div class="body flush"><div class="tbl-wrap"><table class="rsp"><thead><tr>'
      +'<th>What you were entering</th><th>Left at</th><th></th></tr></thead><tbody>';
    dl.forEach(function(x){

        +'<td class="num" data-l="Left at">'+esc(new Date(x.at).toLocaleString())+'</td>'
        +'<td data-l=""><button class="link" data-dopen="'+esc(x.key)+'">Continue</button>'
        +'<button class="link del" data-ddel="'+esc(x.key)+'">Discard</button></td></tr>';});
    h+='</tbody></table></div></div></div>';}
  h+=jobTable("Overdue \u2014 scheduled date passed",overdue);
  h+=jobTable("Scheduled in the next 7 days",soon);
  h+=jobTable("Service report not submitted",repPending);
  h+=jobTable("Quotation to be sent to client",qtnPending);

  var td=state.duties.filter(function(d){return d.date===t;});

  else{h+='<div class="body flush"><div class="tbl-wrap"><table class="rsp"><thead><tr><th>Site / job</th><th>Activity</th><th>Technicians</th><th>Location</th><th>Remarks</th></tr></thead><tbody>';
    td.forEach(function(d){h+='<tr><td class="site-name" data-l="Site">'+esc(d.siteText)+'</td>'
      +'<td data-l="Activity"><span class="pill amc">'+esc(d.activity)+'</span></td>'

function clientList(){
  var m=state.curMonth,map={};
  amcOf(m).forEach(function(a){(map[a.client]=map[a.client]||{name:a.client,amc:[],gmc:[],calls:[]}).amc.push(a);});
  state.gmc.forEach(function(g){(map[g.client]=map[g.client]||{name:g.client,amc:[],gmc:[],calls:[]}).gmc.push(g);});
  state.oncall.forEach(function(o){if(map[o.client])map[o.client].calls.push(o);});
  var out=[];for(var k in map)out.push(map[k]);
  out.sort(function(a,b){return a.name<b.name?-1:1;});
  out.forEach(function(c){
    c.total=c.amc.length+c.gmc.length;
    c.done=c.amc.filter(function(x){return done(x.status);}).length+c.gmc.filter(function(x){return done(x.status);}).length;
    c.left=c.total-c.done;c.location=(c.amc[0]||c.gmc[0]||{}).location||"";});
  return out;
}
function matchClient(c,q){
  if(!q)return true;
  if(c.name.toLowerCase().indexOf(q)>-1)return true;
  var hit=false;
  c.amc.forEach(function(a){if((a.amcNo+" "+a.site+" "+a.system).toLowerCase().indexOf(q)>-1)hit=true;});
  c.gmc.forEach(function(g){if((g.gmcNo+" "+g.clientRaw+" "+g.desc+" "+g.jccNo).toLowerCase().indexOf(q)>-1)hit=true;});
  return hit;
}
function hit(s,q){return String(s==null?"":s).toLowerCase().indexOf(q)>-1;}
function globalFind(q){
  var R={amc:[],gmc:[],call:[],files:[],duty:[],contract:[],tech:[]};
  state.amc.forEach(function(a){
    if(hit(a.amcNo,q)||hit(a.site,q)||hit(a.system,q)||hit(a.client,q)||hit(a.srNo,q)
      ||hit(a.serviceNo,q)||hit(a.notes,q)||hit(techNames(a.techs),q)||hit(a.location,q))R.amc.push(a);});
  state.gmc.forEach(function(g){
    if(hit(g.gmcNo,q)||hit(g.clientRaw,q)||hit(g.client,q)||hit(g.desc,q)||hit(g.scope,q)
      ||hit(g.jccNo,q)||hit(g.remarks,q)||hit(techNames(g.techs),q))R.gmc.push(g);});
  state.oncall.forEach(function(o){
    if(hit(o.client,q)||hit(o.issue,q)||hit(o.caller,q)||hit(o.gmcNo,q)||hit(o.remarks,q)
      ||hit(o.phone,q)||hit(techNames(o.techIds),q))R.call.push(o);});
  (state.files||[]).forEach(function(f){
    if(hit(f.name,q)||hit(f.title,q)||hit(f.site,q)||hit(f.jobLabel,q)||hit(f.srNo,q)
      ||hit(f.cat,q)||hit(f.serviceNo,q)||hit(techNames(f.techs),q))R.files.push(f);});
  state.duties.forEach(function(d){
    if(hit(d.siteText,q)||hit(d.activity,q)||hit(d.remarks,q)||hit(techNames(d.techIds),q))R.duty.push(d);});
  state.contracts.forEach(function(c){
    if(hit(c.amcNo,q)||hit(c.site,q)||hit(c.system,q)||hit(c.freq,q))R.contract.push(c);});
  state.techs.forEach(function(x){if(hit(x.name,q)||hit(x.trade,q))R.tech.push(x);});
  R.total=R.amc.length+R.gmc.length+R.call.length+R.files.length+R.duty.length+R.contract.length+R.tech.length;
  return R;}

/* A line is overdue once its month has passed and it is still not finished. */
function amcFlag(a){
  var past=mIdx(a.month)<mIdx(mKey(today()));
  if(a.status==="Completed"||a.status==="Cancelled")return "done";
  if(a.status==="Under Renewal")return "renew";
  if(a.status==="On Hold")return "hold";
  if(past)return "over";
  if(a.status==="Open")return "open";
  return "";}
function flagBadge(f){
  if(f==="over")return '<span class="flag over">Overdue</span>';
  if(f==="open")return '<span class="flag open">Open</span>';
  if(f==="renew")return '<span class="flag renew">Renewal</span>';
  if(f==="hold")return '<span class="flag hold">On hold</span>';
  return "";}
function amcLegend(rows){
  var n={over:0,open:0,renew:0,hold:0};
  rows.forEach(function(a){var f=amcFlag(a);if(n[f]!==undefined)n[f]++;});
  var bit=function(c,lbl,k){return n[k]?'<span><i style="background:'+c+'"></i>'+lbl+' '+n[k]+'</span>':"";};
  var s=bit("#C00000","Overdue",'over')+bit("#B26A00","Open",'open')
    +bit("#5B3FA8","Under renewal",'renew')+bit("#6B7686","On hold",'hold');
  return s?'<div class="legend">'+s+'</div>':"";}

function cPill(s){return s==="Active"?'<span class="pill ok">Active</span>'
  :'<span class="pill '+(s==="On Hold"||s==="Expired"?"hold":"due")+'">'+esc(s||"Active")+'</span>';}

/* ---------- duty day message (matches the Word duty schedule layout) ---------- */
var dutyDay=null;
function dutyDayDate(){return dutyDay||iso(today());}
function dutySystemOf(d){
  if(!d.ref)return "";
  var p=String(d.ref).split("|");
  if(p[0]==="amc"){for(var i=0;i<state.amc.length;i++)if(state.amc[i].id===p[1])return state.amc[i].system||"";}
  return "";}
function dutyOfDay(ds){
  return state.duties.filter(function(d){return d.date===ds;})
    .sort(function(a,b){return (a.siteText||"")<(b.siteText||"")?-1:1;});}
function dutyMessage(ds){
  var list=dutyOfDay(ds),dt=parseISO(ds);
  var wkn=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][dt.getDay()];
  var out="*GSSC \u2014 DUTY SCHEDULE*\n*"+fmt(ds)+" / "+wkn+"*\n";
  if(!list.length)return out+"\nNo duty entered for this day.";
  list.forEach(function(d,i){
    var site=d.siteText||"";
    if(d.location)site+=", "+d.location;
    var act=d.activity||"";
    var sys=dutySystemOf(d);
    if(sys&&act==="AMC")act+=" ("+sys+")";
    out+="\n"+(i+1)+". "+(techNames(d.techIds)||"No technician")+"\n   "+site+(act?"  \u2014  "+act:"");
    if(d.remarks)out+="\n   ("+d.remarks+")";
    out+="\n";});
  var men={};list.forEach(function(d){(d.techIds||[]).forEach(function(t){men[t]=1;});});
  out+="\nTotal: "+list.length+" site(s), "+Object.keys(men).length+" man";
  return out;}
function dutyShare(ds){
  var txt=dutyMessage(ds);
  if(navigator.share){navigator.share({text:txt}).catch(function(){});return;}
  dutyCopy(ds);}
function dutyCopy(ds){
  var txt=dutyMessage(ds);
  function fallback(){
    var ta=document.createElement("textarea");ta.value=txt;
    ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);
    ta.select();try{document.execCommand("copy");toast("Duty schedule copied");}
    catch(e){toast("Could not copy \u2014 select the text and copy by hand");}
    document.body.removeChild(ta);}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){toast("Duty schedule copied");},fallback);}
  else fallback();}
function waClean(n){return String(n||"").replace(/[^0-9]/g,"");}
function dutySendTo(num,ds){
  var n=waClean(num);
  if(!n)return toast("That number looks wrong");
  window.open("https://wa.me/"+n+"?text="+encodeURIComponent(dutyMessage(ds)),"_blank");}

/* ---------- phone contact picker (Chrome on Android) ---------- */
function pickerOk(){
  try{return !!(navigator.contacts&&navigator.contacts.select&&window.ContactsManager);}
  catch(e){return false;}}
function pickContact(cb){
  if(!pickerOk())return toast("Your phone does not offer the contact picker \u2014 type the number");
  navigator.contacts.select(["name","tel"],{multiple:false}).then(function(list){
    if(!list||!list.length)return;
    var c=list[0];
    var nm=(c.name&&c.name.length)?c.name[0]:"";
    var tel=(c.tel&&c.tel.length)?c.tel[0]:"";
    if(!tel)return toast("That contact has no number saved");
    var n=waClean(tel);
    if(n.length===9&&n.charAt(0)==="5")n="966"+n;
    else if(n.length===10&&n.charAt(0)==="0")n="966"+n.slice(1);
    cb({name:nm,num:n});
  }).catch(function(){toast("Contact picker was closed");});}

var IDB=null,MEMF={};
function idb(){
  if(IDB)return IDB;
  IDB=new Promise(function(res,rej){
    try{
      if(!window.indexedDB)return rej(new Error("no storage"));
      var q=indexedDB.open("gssc-files",1);
      q.onupgradeneeded=function(){try{q.result.createObjectStore("blobs");}catch(e){}};
      q.onsuccess=function(){res(q.result);};
      q.onerror=function(){rej(q.error||new Error("blocked"));};
      q.onblocked=function(){rej(new Error("blocked"));};
    }catch(e){rej(e);}});
  IDB.catch(function(){});
  return IDB;}
function idbPut(k,v){
  MEMF[k]=v;
  return idb().then(function(db){return new Promise(function(res){
    try{
      var tr=db.transaction("blobs","readwrite");
      tr.objectStore("blobs").put(v,k);
      tr.oncomplete=function(){res(true);};
      tr.onerror=function(){res(false);};
      tr.onabort=function(){res(false);};
    }catch(e){res(false);}});}).catch(function(){return false;});}
function idbGet(k){
  return idb().then(function(db){return new Promise(function(res){
    try{
      var tr=db.transaction("blobs","readonly"),rq=tr.objectStore("blobs").get(k);
      rq.onsuccess=function(){res(rq.result||MEMF[k]||null);};
      rq.onerror=function(){res(MEMF[k]||null);};
    }catch(e){res(MEMF[k]||null);}});}).catch(function(){return MEMF[k]||null;});}
function idbDel(k){
  delete MEMF[k];
  return idb().then(function(db){return new Promise(function(res){
    try{
      var tr=db.transaction("blobs","readwrite");
      tr.objectStore("blobs").delete(k);
      tr.oncomplete=function(){res(true);};
      tr.onerror=function(){res(false);};
    }catch(e){res(false);}});}).catch(function(){return false;});}

function shrinkCanvas(src,cb,orig){
  var img=new Image();
  img.onload=function(){
    try{
      var MAX=1400,w=img.width||1,h=img.height||1;
      if(w>MAX||h>MAX){var s=Math.min(MAX/w,MAX/h);w=Math.round(w*s);h=Math.round(h*s);}
      var cv=document.createElement("canvas");cv.width=w;cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      var out=cv.toDataURL("image/jpeg",0.7);
      if(out.length>2200000)out=cv.toDataURL("image/jpeg",0.5);
      cb(out,"image/jpeg");
    }catch(err){cb(orig,"");}};
  img.onerror=function(){cb(orig,"");};
  img.src=src;}
/* Storing a site photo and reading a printed form need different pictures.
   For reading we keep far more detail, or the small print is lost. */
function readCanvas(src,cb){
  var img=new Image();
  img.onload=function(){
    try{
      var MAX=2200,w=img.width||1,h=img.height||1;
      if(w>MAX||h>MAX){var s=Math.min(MAX/w,MAX/h);w=Math.round(w*s);h=Math.round(h*s);}
      var cv=document.createElement("canvas");cv.width=w;cv.height=h;
      var cx=cv.getContext("2d");
      cx.fillStyle="#fff";cx.fillRect(0,0,w,h);
      cx.drawImage(img,0,0,w,h);
      var out=cv.toDataURL("image/jpeg",0.92);
      if(out.length>4600000)out=cv.toDataURL("image/jpeg",0.8);
      cb(out,"image/jpeg",w+"\u00d7"+h);
    }catch(err){cb(src,"image/jpeg","");}};
  img.onerror=function(){cb(src,"image/jpeg","");};
  img.src=src;}
function readImage(file,cb){
  var fr=new FileReader();
  fr.onerror=function(){cb("","","");};
  fr.onload=function(){readCanvas(String(fr.result),cb);};
  fr.readAsDataURL(file);}

function shrinkImage(file,cb){
  var fr=new FileReader();
  fr.onerror=function(){cb("","",("could not be read"));};
  fr.onload=function(e){
    var raw=e.target.result;
    var looksImage=/^image\//.test(file.type||"")||/\.(jpe?g|png|heic|heif|webp|gif|bmp)$/i.test(file.name||"");
    if(!looksImage)return cb(raw,file.type||"application/octet-stream","");
    if(window.createImageBitmap&&/heic|heif/i.test((file.type||"")+" "+(file.name||""))){
      createImageBitmap(file).then(function(bm){
        try{
          var MAX=1400,w=bm.width,h=bm.height;
          if(w>MAX||h>MAX){var s=Math.min(MAX/w,MAX/h);w=Math.round(w*s);h=Math.round(h*s);}
          var cv=document.createElement("canvas");cv.width=w;cv.height=h;
          cv.getContext("2d").drawImage(bm,0,0,w,h);
          cb(cv.toDataURL("image/jpeg",0.7),"image/jpeg","");
        }catch(err){shrinkCanvas(raw,function(d,m){cb(d,m||file.type,"");},raw);}
      }).catch(function(){shrinkCanvas(raw,function(d,m){cb(d,m||file.type,"");},raw);});
      return;}
    shrinkCanvas(raw,function(d,m){cb(d,m||file.type||"image/jpeg","");},raw);};
  fr.readAsDataURL(file);}

function readName(name,when){
  var s=String(name||"");
  var out={srNo:"",jccNo:"",amcNo:"",gmcNo:"",date:""};
  var m=s.match(/S[FR][\s\-_./]?(\d{3,7})(?!\d)/i);
  if(m)out.srNo="SF/"+m[1];
  m=s.match(/JCC[\s\-_./]?(\d{2,7})(?!\d)/i);
  if(m)out.jccNo=m[1];
  m=s.match(/(?:^|[^A-Za-z0-9])P[\s\-_]?(8\d{4})(?!\d)/i);
  if(m)out.gmcNo="P"+m[1];
  m=s.match(/(?:^|\D)(20\d{2})-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])(?!\d)/);
  if(m)out.date=m[1]+"-"+m[2]+"-"+m[3];
  if(!out.date){m=s.match(/(?:^|\D)(\d{1,2})[-_.](\d{1,2})[-_.](20\d{2})(?!\d)/);
    if(m&&+m[2]>=1&&+m[2]<=12)out.date=m[3]+"-"+pad(+m[2])+"-"+pad(+m[1]);}
  if(!out.date){m=s.match(/(?:^|\D)(\d{1,2})[-_. ]([A-Za-z]{3})[A-Za-z]*[-_. ](20\d{2})(?!\d)/);
    if(m){var ix=MSHORT.indexOf(m[2].toLowerCase());if(ix>-1)out.date=m[3]+"-"+pad(ix+1)+"-"+pad(+m[1]);}}
  if(!out.date){m=s.match(/(?:^|\D)(20\d{2})(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])(?!\d)/);
    if(m)out.date=m[1]+"-"+m[2]+"-"+m[3];}
  if(!out.date&&when)out.date=iso(new Date(when));
  var rest=s.replace(/S[FR][\s\-_./]?\d{3,7}/ig," ").replace(/P[\s\-_]?8\d{4}/ig," ")
    .replace(/20\d{2}[-_.]?\d{2}[-_.]?\d{2}/g," ");
  var nums=rest.match(/(?:^|\D)([6-8]\d{4})(?!\d)/g);
  if(nums&&nums.length)out.amcNo=nums[0].replace(/\D/g,"");
  if(!out.gmcNo&&!out.amcNo){var po=s.match(/\bPO[\s\-_]?(\d{4,8})\b/i);if(po)out.amcNo="PO "+po[1];}
  return out;}

function guessJob(info){
  var ch=jobChoices(),hit="";
  if(info.gmcNo)ch.forEach(function(c){if(!hit&&c.v.indexOf("gmc|")===0&&sameGmc(c.no,info.gmcNo))hit=c.v;});

  return hit;}

var PENDING=[],UPFOR="";
var UPFAIL=[],UPLOG=[];
function ulog(s){
  try{if(!UPLOG.length){var old=localStorage.getItem("gssc-uplog");if(old)UPLOG=old.split("\n");}}catch(e){}
  UPLOG.push(new Date().toLocaleTimeString()+"  "+s);
  while(UPLOG.length>80)UPLOG.shift();
  try{localStorage.setItem("gssc-uplog",UPLOG.join("\n"));}catch(e){}}
function uploadPicked(files){
  if(!files||!files.length)return;
  PENDING=[];UPFAIL=[];var left=files.length;
  ulog("picked "+files.length+" file(s)");
  Array.prototype.forEach.call(files,function(f){
    ulog("   "+f.name+" | type="+(f.type||"none")+" | "+Math.round((f.size||0)/1024)+" KB");});
  toast("Preparing "+files.length+" file(s)\u2026");
  var slots=new Array(files.length);
  var done=function(){
    if(--left>0)return;
    PENDING=slots.filter(function(x){return !!x;});
    uploadModal();};
  Array.prototype.forEach.call(files,function(f,ixf){
    var guard=setTimeout(function(){
      if(slots[ixf])return;
      UPFAIL.push(f.name+" (took too long)");done();},20000);
    try{
      shrinkImage(f,function(dataUrl,mime,err){
        clearTimeout(guard);
        if(!dataUrl){ulog("FAILED to read "+f.name+(err?" - "+err:""));UPFAIL.push(f.name+(err?" ("+err+")":""));return done();}
        ulog("read ok "+f.name+" -> "+Math.round(dataUrl.length/1024)+" KB as "+(mime||"?"));
        var info=readName(f.name,f.lastModified);
        var lo=(f.name||"").toLowerCase();
        var cat=/survey/.test(lo)?"Site survey":(/check ?list/.test(lo)?"Checklist":
          (/quot(ation)?|qtn/.test(lo)?"Quotation / JCC":
          (/s[fr][\s\-_./]?\d{3,}|jcc|report|signed/.test(lo)?"Service report (signed)":"Job completion photo")));
        slots[ixf]={name:f.name,cat:cat,mime:mime||f.type||"application/octet-stream",
          dataUrl:dataUrl,size:Math.round(dataUrl.length*0.75),info:info,job:UPFOR||guessJob(info)};
        done();});
    }catch(e){clearTimeout(guard);UPFAIL.push(f.name+" ("+(e.message||"failed")+")");done();}});}

function pushFiles(){
  if(!SYNC.url)return;
  var todo=state.files.filter(function(f){return !f.drive;});
  if(!todo.length)return;
  var next=function(ix){
    if(ix>=todo.length){save();return;}
    var f=todo[ix];
    idbGet(f.id).then(function(d){
      d=d||f.data;
      if(!d)return next(ix+1);
      return fetch(SYNC.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify({key:SYNC.key,action:"file",name:f.name,mime:f.mime,
          data:String(d).split(",")[1]||""})})
        .then(function(r){return r.json();}).then(function(res){
          if(res&&res.ok){f.drive={id:res.id,url:res.url};f.mod=Date.now();}
          next(ix+1);});
    }).catch(function(){next(ix+1);});};
  next(0);}

function dataUrlToBlob(d){
  var parts=String(d).split(","),m=(parts[0].match(/:(.*?);/)||[])[1]||"application/octet-stream";
  var bin=atob(parts[1]||""),u=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  return new Blob([u],{type:m});}
function openFile(id){
  var f=byId(state.files,id);if(!f)return;
  idbGet(id).then(function(d){
    d=d||f.data;
    if(d){
      try{
        var url=URL.createObjectURL(dataUrlToBlob(d));
        var win=window.open(url,"_blank");
        if(!win){
          var a=document.createElement("a");
          a.href=url;a.download=f.name;a.target="_blank";
          document.body.appendChild(a);a.click();a.remove();
          toast("Opened as a download \u2014 allow pop-ups to view it in a tab");}
        setTimeout(function(){URL.revokeObjectURL(url);},60000);
        return;
      }catch(e){toast("Could not open this file: "+(e.message||e));}}
    if(f.drive&&f.drive.url)window.open(f.drive.url,"_blank");
    else toast("This file was uploaded on your other device. Open it there, or from Drive once it has synced.");});}

function two(n){return (n<10?"0":"")+n;}
function icsStamp(d,allDay){

function icsEsc(s){return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");}

function gcalLink(ev){
  var d=parseISO(ev.date);if(!d)return "#";
  var e=addDays(d,1);
  return "https://calendar.google.com/calendar/render?action=TEMPLATE"
    +"&text="+encodeURIComponent(ev.title)
    +"&dates="+icsStamp(d,true)+"/"+icsStamp(e,true)
    +"&details="+encodeURIComponent(ev.desc||"")
    +"&location="+encodeURIComponent(ev.loc||"")
    +"&ctz=Asia/Riyadh";}

function buildIcs(list){
  var L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//GSSC//AMC Tracker//EN","CALSCALE:GREGORIAN",
    "METHOD:PUBLISH","X-WR-CALNAME:GSSC AMC / GMC Schedule","X-WR-TIMEZONE:Asia/Riyadh"];
  var now=icsStamp(new Date(),false);
  list.forEach(function(ev){
    var d=parseISO(ev.date);if(!d)return;
    L.push("BEGIN:VEVENT");
    L.push("UID:"+ev.id+"@gssc-tracker");
    L.push("DTSTAMP:"+now);
    L.push("DTSTART;VALUE=DATE:"+icsStamp(d,true));
    L.push("DTEND;VALUE=DATE:"+icsStamp(addDays(d,1),true));
    L.push("SUMMARY:"+icsEsc(ev.title));
    if(ev.desc)L.push("DESCRIPTION:"+icsEsc(ev.desc));
    if(ev.loc)L.push("LOCATION:"+icsEsc(ev.loc));
    if(ev.remind>0){
      L.push("BEGIN:VALARM","TRIGGER:-P"+ev.remind+"D","ACTION:DISPLAY",
        "DESCRIPTION:"+icsEsc(ev.title),"END:VALARM");}
    L.push("END:VEVENT");});
  L.push("END:VCALENDAR");
  return L.join("\r\n");}

function downloadIcs(){

  a.href=URL.createObjectURL(blob);a.download="GSSC-schedule.ics";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
  toast(list.length+" job(s) saved as a calendar file");}

/* ---------- sharing ---------- */
function shareFile(id){
  var f=byId(state.files,id);if(!f)return;
  idbGet(id).then(function(d){
    d=d||f.data;
    var txt=(f.cat||"File")+" \u2014 "+(f.jobLabel||f.name)
      +(f.srNo?("\nSR / JCC: "+f.srNo):"")+(f.date?("\nDate: "+fmt(f.date)):"")
      +"\nGulf Safety & Security Co. Ltd.";
    if(d&&navigator.canShare){
      try{
        var b=atob(String(d).split(",")[1]||""),u=new Uint8Array(b.length);
        for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
        var file=new File([u],f.name,{type:f.mime||"image/jpeg"});
        if(navigator.canShare({files:[file]}))
          return navigator.share({files:[file],title:f.name,text:txt}).catch(function(){});
      }catch(e){}}
    if(f.drive&&f.drive.url){
      if(navigator.share)return navigator.share({title:f.name,text:txt,url:f.drive.url}).catch(function(){});
      copyText(f.drive.url+"\n\n"+txt);return;}
    if(d)return openFile(id);
    copyText(txt);}); }
function copyText(s){
  var ta=document.createElement("textarea");
  ta.value=s;ta.style.cssText="position:fixed;left:-9999px";
  document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");toast("Copied \u2014 paste it into WhatsApp or email");}
  catch(e){toast("Could not copy on this device");}
  ta.remove();}
function shareMonthPack(){
  var m=state.curMonth;
  var fs=state.files.filter(function(f){return f.month===m;});
  var byCat={};fs.forEach(function(f){byCat[f.cat||"Other"]=(byCat[f.cat||"Other"]||0)+1;});
  var A=amcOf(m),G=gmcOf(m);
  var lines=["GSSC \u2014 "+mLabel(m),"",
    "AMC services: "+A.filter(function(x){return done(x.status);}).length+" of "+A.length+" completed",
    "GMC jobs: "+G.filter(function(x){return done(x.status);}).length+" of "+G.length+" completed",
    "On-call received: "+callsOf(m).length,""];
  lines.push("Documents on file: "+fs.length);
  for(var k in byCat)lines.push("  "+k+": "+byCat[k]);
  var withLink=fs.filter(function(f){return f.drive&&f.drive.url;});
  if(withLink.length){
    lines.push("","Links:");
    withLink.slice(0,25).forEach(function(f){
      lines.push("  "+(CATSHORT[f.cat]||"File")+" \u2014 "+(f.jobLabel||f.name)+": "+f.drive.url);});}
  else lines.push("","(Link the devices under Data & team to get shareable links.)");
  var txt=lines.join("\n");
  if(navigator.share)navigator.share({title:"GSSC "+mLabel(m),text:txt}).catch(function(){copyText(txt);});
  else copyText(txt);}

var DKEY="";
function draftGet(k){try{return JSON.parse(localStorage.getItem("gssc-draft-"+k)||"null");}catch(e){return null;}}
function draftPut(k,v){try{localStorage.setItem("gssc-draft-"+k,JSON.stringify(v));}catch(e){}}
function draftDel(k){try{localStorage.removeItem("gssc-draft-"+k);}catch(e){}}
function draftList(){
  var out=[];
  try{for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(k&&k.indexOf("gssc-draft-")===0){
      var v=null;try{v=JSON.parse(localStorage.getItem(k));}catch(e){}
      if(v&&v.f&&Object.keys(v.f).length)out.push({key:k.slice(11),at:v.at||0,label:v.label||k.slice(11)});}}}catch(e){}
  return out.sort(function(a,b){return b.at-a.at;});}

/* ---------- duplicate keys and the scanner ---------- */
function dkey(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");}
function amcKey(r){return (r.month||"")+"|"+dkey(r.amcNo)+"|"+dkey(r.serviceNo)
  +"|"+dkey(r.site)+"|"+dkey(r.system);}
function gmcKey(r){return dkey(r.gmcNo);}
function conKey(r){return dkey(r.amcNo);}
function amcSame(a,b){
  return dkey(a.site)===dkey(b.site)&&dkey(a.status)===dkey(b.status)
    &&(a.schedDate||"")===(b.schedDate||"")&&dkey(a.srNo)===dkey(b.srNo);}
function groupDup(list,keyfn){
  var m={},out=[];
  list.forEach(function(r){var k=keyfn(r);if(!k||k==="|"||k==="||")return;(m[k]=m[k]||[]).push(r);});
  for(var k in m)if(m[k].length>1)out.push({key:k,rows:m[k]});
  return out;}
function dupScan(){
  return {amc:groupDup(state.amc,amcKey),
    gmc:groupDup(state.gmc,gmcKey),
    contracts:groupDup(state.contracts,conKey),
    techs:groupDup(state.techs,function(t){return dkey(t.name);})};}
function dupTotal(d){
  var n=0;["amc","gmc","contracts","techs"].forEach(function(k){
    d[k].forEach(function(g){n+=g.rows.length-1;});});
  return n;}
function dupModal(){
  var d=dupScan(),n=dupTotal(d);
  var body="";
  if(!n)body='<div class="empty"><b>No duplicates found</b>Every AMC line, GMC job, contract and technician is unique.</div>';
  else{
    body='<div class="info">Found <b>'+n+'</b> extra copy(ies). The first of each group is kept and the rest removed.</div>';
    var sect=function(title,groups,lbl){
      if(!groups.length)return "";
      var h='<div class="field"><label>'+title+' \u2014 '+groups.length+' group(s)</label>'
        +'<div class="tbl-wrap"><table class="rsp"><tbody>';
      groups.slice(0,25).forEach(function(g){
        h+='<tr><td>'+esc(lbl(g.rows[0]))+' <span class="count">'+g.rows.length+' copies</span></td></tr>';});
      if(groups.length>25)h+='<tr><td class="hint">and '+(groups.length-25)+' more\u2026</td></tr>';
      return h+'</tbody></table></div></div>';};
    body+=sect("AMC lines",d.amc,function(r){return mLabel(r.month)+" \u00b7 "+r.amcNo+" \u00b7 "+r.site+" \u00b7 "+r.serviceNo;})
      +sect("GMC jobs",d.gmc,function(r){return r.gmcNo+" \u00b7 "+r.client;})
      +sect("Contracts",d.contracts,function(r){return r.amcNo+" \u00b7 "+r.site;})
      +sect("Technicians",d.techs,function(r){return r.name;});
    body+='<p class="hint">Take a full backup first if you are unsure. This cannot be undone.</p>';}
  openModal("Check for duplicates",body,n?function(){
    var kill={};
    ["amc","gmc","contracts","techs"].forEach(function(k){
      d[k].forEach(function(g){g.rows.slice(1).forEach(function(r){kill[k+":"+r.id]=1;});});});
    ["amc","gmc","contracts","techs"].forEach(function(k){
      state[k]=state[k].filter(function(r){return !kill[k+":"+r.id];});});
    closeModal();commit(n+" duplicate(s) removed");
  }:null,"",false,null,null);}

/* ---------- reading an on-call log out of a sheet ---------- */
function parseCall(rows){
  if(!rows||rows.length<2)return null;
  var hi=-1,map=null;
  for(var r=0;r<Math.min(rows.length,12);r++){
    var m=callCols(rows[r]);
    if(m){hi=r;map=m;break;}}
  if(hi<0)return null;
  var out=[];
  for(var i=hi+1;i<rows.length;i++){
    var row=rows[i]||[];
    var pick=function(k){return map[k]===undefined?"":String(row[map[k]]||"").trim();};
    var client=pick("client");
    if(!client)continue;
    if(/^(total|grand total|summary)$/i.test(client))continue;
    out.push({client:client,date:xlDate(pick("date")),time:pick("time"),
      caller:pick("caller"),phone:pick("phone"),issue:pick("issue"),
      techText:pick("tech"),status:pick("status"),gmcNo:pick("gmc"),
      completedDate:xlDate(pick("done")),remarks:pick("remark")});}
  return out.length?out:null;}

function callCols(hdr){
  if(!hdr)return null;
  var m={},nz=function(s){return String(s||"").toLowerCase().replace(/[^a-z]/g,"");};
  for(var i=0;i<hdr.length;i++){
    var h=nz(hdr[i]);
    if(!h)continue;
    if(m.client===undefined&&/client|site|customer|location/.test(h))m.client=i;
    if(m.date===undefined&&/^date|calldate|reporteddate/.test(h))m.date=i;
    if(m.time===undefined&&/time/.test(h))m.time=i;
    if(m.caller===undefined&&/caller|contactperson|reportedby|attn/.test(h))m.caller=i;
    if(m.phone===undefined&&/phone|mobile|contactno|number/.test(h))m.phone=i;
    if(m.issue===undefined&&/issue|complaint|problem|fault|description|nature/.test(h))m.issue=i;
    if(m.tech===undefined&&/tech|engineer|attendedby|manpower|name/.test(h))m.tech=i;
    if(m.status===undefined&&/status/.test(h))m.status=i;
    if(m.gmc===undefined&&/gmc|osf|jobno/.test(h))m.gmc=i;
    if(m.done===undefined&&/completed|closeddate|closingdate|finish/.test(h))m.done=i;
    if(m.remark===undefined&&/remark|note|comment/.test(h))m.remark=i;}
  return (m.client!==undefined&&(m.date!==undefined||m.issue!==undefined))?m:null;}

function callImportModal(recs,src){
  var known=0,newT=[];
  var existing={};
  state.oncall.forEach(function(o){existing[(o.date||"")+"|"+dkey(o.client)]=1;});
  recs.forEach(function(r){
    if(existing[(r.date||"")+"|"+dkey(r.client)])known++;
    splitTechs(r.techText).forEach(function(n){
      if(!matchTech(n)&&newT.indexOf(n)<0)newT.push(n);});});
  var body='<div class="info">Read <b>'+recs.length+'</b> call(s) from '+esc(src)+'.'
    +(known?' <b>'+known+'</b> of them look like calls you already have.':'')+'</div>'
    +'<div class="field"><label>When a call is already stored</label><select id="cDup">'
    +'<option value="skip">Skip it \u2014 keep what I have</option>'
    +'<option value="add">Add it anyway</option></select>'
    +'<p class="hint" style="margin-top:5px">A call counts as already stored when the date and the site both match.</p></div>'
    +(newT.length?'<div class="field"><label style="text-transform:none;letter-spacing:0;font-weight:400;font-size:13.5px">'
      +'<input type="checkbox" id="cNewT" checked style="width:auto;margin-right:6px">Add '+newT.length
      +' technician name(s) not yet on the team: <b>'+esc(newT.slice(0,10).join(", "))+(newT.length>10?" \u2026":"")
      +'</b></label></div>':'')
    +'<div class="tbl-wrap"><table class="rsp"><thead><tr><th>Date</th><th>Site</th><th>Issue</th></tr></thead><tbody>'
    +recs.slice(0,12).map(function(r){
      return '<tr><td>'+esc(r.date?fmt(r.date):"\u2014")+'</td><td>'+esc(r.client)+'</td>'
        +'<td>'+esc((r.issue||"").slice(0,50))+'</td></tr>';}).join("")
    +(recs.length>12?'<tr><td colspan="3" class="hint">and '+(recs.length-12)+' more\u2026</td></tr>':'')
    +'</tbody></table></div>';
  openModal("Import on-call log",body,function(){
    var mode=val("cDup"),addEl=document.getElementById("cNewT"),addT=addEl?addEl.checked:false;
    var have={};state.oncall.forEach(function(o){have[(o.date||"")+"|"+dkey(o.client)]=1;});
    var added=0,skipped=0;
    recs.forEach(function(r){
      var k=(r.date||"")+"|"+dkey(r.client);
      if(have[k]&&mode==="skip"){skipped++;return;}
      var ids=[],left=[];
      splitTechs(r.techText).forEach(function(n){
        var t=matchTech(n);
        if(!t&&addT){t={id:uid(),name:n,trade:"",active:true};state.techs.push(t);}
        if(t)ids.push(t.id);else left.push(n);});
      var st=r.status||"";
      if(!/^(open|closed|in progress)$/i.test(st))st=r.completedDate?"Closed":"Open";
      state.oncall.push({id:uid(),date:r.date||iso(today()),time:r.time||"",
        caller:r.caller||"",phone:r.phone||"",client:r.client,location:"Dammam",
        issue:r.issue||"",techIds:ids,status:st,gmcNo:r.gmcNo||"",attendedAt:"",
        completedDate:r.completedDate||"",remarks:[r.remarks,left.join(", ")].filter(Boolean).join(" \u00b7 ")});
      have[k]=1;added++;});
    closeModal();
    commit(added+" call(s) added"+(skipped?", "+skipped+" already stored":""));
  },"",true);}

function importCallFiles(files){
  var all=[],left=files.length,src="";
  if(!left)return;
  Array.prototype.forEach.call(files,function(f){
    readWorkbook(f,function(sheets){
      sheets.forEach(function(s){
        var r=parseCall(s.rows);
        if(r){all=all.concat(r);src=f.name;}});
      if(--left===0){
        if(!all.length)return toast("No on-call table found. The sheet needs a site column and a date or issue column.");
        callImportModal(all,src);}});});}

/* ================= generate next month ================= */
function generateMonth(target){
  var added=0,skipped=0,rows=[];
  state.contracts.forEach(function(c){
    var lines=state.amc.filter(function(a){return a.contractId===c.id&&mIdx(a.month)<mIdx(target);});
    if(!lines.length)return;
    var last="";lines.forEach(function(a){if(!last||mIdx(a.month)>mIdx(last))last=a.month;});
    var gap=mIdx(target)-mIdx(last),iv=freqMonths(c.freq);
    if(gap<=0||gap%iv!==0){skipped++;return;}
    lines.filter(function(a){return a.month===last;}).forEach(function(a){
      rows.push({id:uid(),month:target,contractId:c.id,amcNo:a.amcNo,site:a.site,system:a.system,
        serviceNo:nextServ(a.serviceNo),client:a.client,location:a.location,freq:c.freq,
        contractStatus:c.contractStatus,status:c.contractStatus==="On Hold"?"On Hold":"Open",
        schedDate:"",doneDate:"",report:"Not submitted",qtn:"Not required",techs:[],notes:""});
      added++;});
  });
  return {rows:rows,added:added,skipped:skipped};
}
